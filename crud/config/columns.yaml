users:
  table: users
  soft_delete:
    strategy: is_active
  list_default_where:
    is_active: true
  allowed:
    - id
    - first_name
    - last_name
    - phone
    - email
    - username
    - is_active
    - created_at
  writable:
    - first_name
    - last_name
    - phone
    - email
    - username
    - password_hash
    - is_active
  order_by: [id]
  order_dir: DESC
  unique_messages:
    users_username_key: نام کاربری تکراری است
    users_email_key: ایمیل تکراری است
    users_phone_key: شماره تلفن تکراری است

