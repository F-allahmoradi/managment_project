<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>وظایف</title>
  <link rel="stylesheet" href="fonts/vazirmatn.css">
  <link rel="stylesheet" href="mobile-shell.css">
  <link rel="stylesheet" href="mobile-ui.css">
  <script src="mobile-session.js"></script>
  <script>MobileSession.redirectIfAnonymous();</script>
  <style>
    .task-switch {
      margin: 12px 16px 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      border-radius: 16px;
      background: linear-gradient(160deg, rgba(25, 45, 95, 0.92), rgba(12, 22, 55, 0.96));
      border: 1px solid rgba(100, 180, 255, 0.32);
      box-shadow: 0 0 25px rgba(80, 140, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .switch-opt {
      min-height: 48px;
      border-radius: 12px;
      padding: 8px 6px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      color: rgba(255, 255, 255, 0.72);
    }
    .switch-opt.on {
      background: linear-gradient(135deg, #2a5acc, #6a3acc);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(120, 80, 255, 0.45);
    }
  </style>
</head>
<body data-page="tasks">
  <main class="screen">
    <div class="status"><time>سامانه</time></div>
    <header class="header">
      <a class="back" href="admin-mobile.html" aria-label="بازگشت">→</a>
      <h1>وظایف</h1>
      <span style="width:38px"></span>
    </header>
    <nav class="task-switch" role="tablist" aria-label="بخش‌های وظایف">
      <button class="switch-opt on" id="tab-task-create" type="button" role="tab" aria-selected="true" aria-controls="panel-task-create" data-panel="create">ثبت وظیفه</button>
      <button class="switch-opt" id="tab-task-list" type="button" role="tab" aria-selected="false" aria-controls="panel-task-list" data-panel="list">لیست وظایف</button>
    </nav>
    <div class="task-panel" id="panel-task-create" data-panel="create" role="tabpanel" aria-labelledby="tab-task-create">
    <form class="form-card" id="task-form">
      <div class="field">
        <label for="task-project">پروژه</label>
        <select id="task-project" required></select>
      </div>
      <div class="field">
        <label for="task-title">عنوان وظیفه</label>
        <input id="task-title" required maxlength="200" placeholder="مثلاً تهیه صورتجلسه">
      </div>
      <div class="field">
        <label for="task-desc">شرح</label>
        <textarea id="task-desc"></textarea>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="task-status">وضعیت</label>
          <select id="task-status">
            <option>شروع نشده</option>
            <option>در حال انجام</option>
            <option>در انتظار</option>
            <option>تکمیل شده</option>
          </select>
        </div>
        <div class="field">
          <label for="task-priority">اولویت</label>
          <select id="task-priority">
            <option>متوسط</option>
            <option>کم</option>
            <option>زیاد</option>
            <option>فوری</option>
          </select>
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="task-importance">اهمیت</label>
          <select id="task-importance">
            <option>متوسط</option>
            <option>کم</option>
            <option>زیاد</option>
            <option>حیاتی</option>
          </select>
        </div>
        <div class="field">
          <label for="task-due">مهلت</label>
          <input id="task-due" type="date">
        </div>
      </div>
      <div class="field">
        <label for="task-start">شروع</label>
        <input id="task-start" type="date">
      </div>
      <div class="field">
        <label for="task-assignee">مسئول (عضو پروژه)</label>
        <select id="task-assignee"></select>
      </div>
      <button class="primary-btn" type="submit" style="width:100%;margin:16px 0 0">ثبت وظیفه</button>
    </form>
    </div>
    <div class="task-panel" id="panel-task-list" data-panel="list" role="tabpanel" aria-labelledby="tab-task-list" hidden>
      <div class="form-card">
        <div class="field">
          <label for="task-list-project">پروژه</label>
          <select id="task-list-project"></select>
        </div>
      </div>
      <div id="task-list"></div>
    </div>
  </main>
  <nav class="bnav">
    <a class="nitem" href="admin-mobile.html"><span>خانه</span></a>
    <a class="nitem" href="projects.html"><span>پروژه‌ها</span></a>
    <a class="nitem" href="meetings.html"><span>جلسات</span></a>
    <a class="nitem on" href="tasks.html"><span>وظایف</span></a>
    <a class="nitem" href="reports.html"><span>گزارش‌ها</span></a>
  </nav>
  <script src="mobile-app.js"></script>
  <script>
    (function () {
      var buttons = document.querySelectorAll(".task-switch .switch-opt");
      var panels = document.querySelectorAll(".task-panel");
      buttons.forEach(function (button) {
        button.addEventListener("click", function () {
          var name = button.getAttribute("data-panel");
          buttons.forEach(function (item) {
            var on = item === button;
            item.classList.toggle("on", on);
            item.setAttribute("aria-selected", on ? "true" : "false");
          });
          panels.forEach(function (panel) {
            panel.hidden = panel.getAttribute("data-panel") !== name;
          });
        });
      });
    })();
  </script>
</body>
</html>
