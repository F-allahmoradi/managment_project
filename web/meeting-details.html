<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>جلسه</title>
  <link rel="stylesheet" href="fonts/vazirmatn.css">
  <link rel="stylesheet" href="mobile-ui.css">
  <script src="mobile-session.js"></script>
  <script>MobileSession.redirectIfAnonymous();</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: radial-gradient(ellipse at 20% 10%, #0d2050 0%, #081230 30%, #030614 70%, #010308 100%);
      font-family: "Vazirmatn", sans-serif;
      font-weight: 400;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    button, input { font-family: inherit; }
    button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
    }
    a { color: inherit; text-decoration: none; }
    input::placeholder { color: rgba(255, 255, 255, 0.4); }

    .screen {
      width: min(430px, 100%);
      padding-top: env(safe-area-inset-top);
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: 200px;
      scrollbar-width: none;
    }
    .screen::-webkit-scrollbar { width: 0; height: 0; }


    .header {
      height: 60px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }
    .back {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(20, 40, 80, 0.7);
      border: 1px solid rgba(100, 180, 255, 0.35);
      box-shadow: 0 0 10px rgba(80, 160, 255, 0.2);
      display: grid;
      place-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .back:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 13px rgba(80, 160, 255, 0.26);
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }
    .hdr-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bell-wrap {
      position: relative;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
    }
    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ff2d55;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      line-height: 1;
    }

    .hero {
      margin: 12px 16px 0;
      border-radius: 22px;
      padding: 20px;
      background: linear-gradient(160deg, rgba(30, 55, 120, 0.92) 0%, rgba(15, 30, 70, 0.96) 100%);
      border: 1px solid rgba(100, 180, 255, 0.35);
      box-shadow: 0 0 35px rgba(80, 160, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
    }
    .hero-top {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .cal-art {
      width: 110px;
      height: 110px;
      flex: none;
      filter: drop-shadow(0 0 10px rgba(100, 180, 255, 0.7));
    }
    .hero-copy {
      flex-grow: 1;
      min-width: 0;
      text-align: right;
    }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1a6a4a, #2a8a5a);
      border: 1px solid rgba(80, 220, 140, 0.5);
      font-size: 11px;
      font-weight: 600;
      color: #a0ffc0;
      margin-bottom: 8px;
    }
    .hero-copy h2 {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.5;
    }
    .hero-copy p {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.7;
      margin-top: 6px;
    }

    .info-row {
      margin-top: 16px;
      display: flex;
      flex-direction: row;
      gap: 0;
      border-top: 1px solid rgba(100, 180, 255, 0.15);
      padding-top: 12px;
    }
    .info {
      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .info-ico {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(30, 60, 110, 0.5);
      border: 1px solid rgba(100, 180, 255, 0.3);
      display: grid;
      place-items: center;
      flex: none;
    }
    .info-text { min-width: 0; }
    .info-label {
      display: block;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.3;
    }
    .info-value {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.35;
    }

    .tabs {
      margin: 14px 16px 0;
      height: 44px;
      border-radius: 14px;
      background: rgba(10, 25, 55, 0.8);
      border: 1px solid rgba(80, 160, 255, 0.25);
      display: flex;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .tab {
      flex: 1;
      text-align: center;
      line-height: 44px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .tab.on {
      background: linear-gradient(135deg, #5a3aaa, #7a4acc);
      font-weight: 600;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(120, 100, 255, 0.35);
    }
    .tab:hover { transform: translateY(-1px); }
    .tab svg { flex: none; }

    .card {
      margin: 14px 16px 0;
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(160deg, rgba(20, 45, 90, 0.85), rgba(10, 25, 55, 0.9));
      border: 1px solid rgba(80, 160, 255, 0.25);
      box-shadow: 0 0 20px rgba(60, 140, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .card-head {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    .ico-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(40, 80, 160, 0.5);
      border: 1px solid rgba(100, 180, 255, 0.4);
      display: grid;
      place-items: center;
      flex: none;
    }
    .card-head h2 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }
    .summary-text {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.9;
      margin-top: 10px;
    }

    .chat-head {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }
    .chat-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .messages {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 10px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(100, 180, 255, 0.4);
      background: linear-gradient(135deg, #1a3a6a, #0a1a3a);
      display: grid;
      place-items: center;
      flex: none;
    }
    .avatar.purple {
      background: linear-gradient(135deg, #4a2a8a, #2a1a5a);
    }
    .msg-body { flex-grow: 1; min-width: 0; }
    .msg-meta {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }
    .msg-name {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
    }
    .msg-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
    }
    .bubble {
      margin-top: 6px;
      max-width: 90%;
      border-radius: 14px 4px 14px 14px;
      padding: 12px 14px;
      background: linear-gradient(135deg, rgba(30, 60, 120, 0.9), rgba(15, 35, 70, 0.95));
      border: 1px solid rgba(80, 160, 255, 0.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .bubble.purple {
      background: linear-gradient(135deg, rgba(60, 40, 120, 0.9), rgba(35, 20, 80, 0.95));
      border: 1px solid rgba(140, 120, 255, 0.35);
    }
    .bubble p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.7;
    }

    .composer {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 358px;
      border-radius: 18px;
      padding: 12px;
      background: linear-gradient(160deg, rgba(20, 45, 90, 0.9), rgba(10, 25, 55, 0.95));
      border: 1px solid rgba(80, 160, 255, 0.3);
      box-shadow: 0 0 25px rgba(60, 140, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 6;
    }
    .input-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }
    .plus, .send {
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 50%;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .plus {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3a5aaa, #2a4a9a);
      border: 1px solid rgba(100, 180, 255, 0.4);
      box-shadow: 0 0 12px rgba(80, 160, 255, 0.3);
    }
    .plus:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 16px rgba(80, 160, 255, 0.39);
    }
    .chat-input {
      flex-grow: 1;
      height: 42px;
      border-radius: 21px;
      background: rgba(10, 25, 55, 0.6);
      border: 1px solid rgba(80, 160, 255, 0.25);
      padding: 0 16px;
      font-size: 13px;
      color: #ffffff;
      outline: none;
    }
    .send {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #6a3acc, #8a5aec);
      border: 1px solid rgba(200, 180, 255, 0.5);
      box-shadow: 0 0 16px rgba(140, 100, 255, 0.5);
    }
    .send:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 21px rgba(140, 100, 255, 0.65);
    }
    .acts {
      margin-top: 10px;
      display: flex;
      flex-direction: row;
      gap: 8px;
      justify-content: space-around;
    }
    .act {
      width: 58px;
      height: 62px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(25, 50, 90, 0.7), rgba(12, 30, 60, 0.8));
      border: 1px solid rgba(80, 160, 255, 0.3);
      box-shadow: 0 0 10px rgba(60, 140, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .act span {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
    }
    .act:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 13px rgba(60, 140, 255, 0.195), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .bnav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(430px, 100%);
      height: 80px;
      background: linear-gradient(180deg, rgba(10, 25, 55, 0.95), rgba(5, 12, 30, 0.98));
      border-top: 1px solid rgba(80, 160, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      z-index: 5;
    }
    .nitem {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: rgba(255, 255, 255, 0.45);
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .nitem span {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
    }
    .nitem:hover {
      transform: translateY(-1px);
      filter: drop-shadow(0 0 6px rgba(100, 180, 255, 0.2));
    }
  </style>
</head>
<body data-page="meeting-details">
  <main class="screen">
    <header class="header">
      <a class="back" href="meetings.html" aria-label="بازگشت">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M7.2 3.4 13 9l-5.8 5.6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1>جلسه</h1>
      <div class="hdr-left">
        <div class="bell-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.2 9.4a5.8 5.8 0 1 1 11.6 0c0 4.1 1.4 5.3 1.4 5.3H4.8s1.4-1.2 1.4-5.3z" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M10 18.6a2 2 0 0 0 4 0" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span class="badge">3</span>
        </div>
        <button type="button" aria-label="منو">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="#ffffff" aria-hidden="true">
            <circle cx="10" cy="4.2" r="1.5"/>
            <circle cx="10" cy="10" r="1.5"/>
            <circle cx="10" cy="15.8" r="1.5"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-top">
        <svg class="cal-art" viewBox="0 0 110 110" aria-hidden="true">
          <defs>
            <linearGradient id="pedestal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1a4a8a"/>
              <stop offset="100%" stop-color="#0a2050"/>
            </linearGradient>
            <linearGradient id="calBody" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4a6acc"/>
              <stop offset="100%" stop-color="#2a4aaa"/>
            </linearGradient>
            <linearGradient id="clockFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6a4acc"/>
              <stop offset="100%" stop-color="#4a2aaa"/>
            </linearGradient>
            <filter id="glowRing" x="-20%" y="-40%" width="140%" height="180%">
              <feGaussianBlur stdDeviation="3"/>
            </filter>
          </defs>
          <ellipse cx="55" cy="99" rx="42.5" ry="10" fill="none" stroke="rgba(100,200,255,0.5)" stroke-width="2" filter="url(#glowRing)"/>
          <ellipse cx="55" cy="101" rx="40" ry="8" fill="url(#pedestal)" stroke="rgba(100,180,255,0.4)" stroke-width="1.2"/>
          <rect x="20" y="16" width="70" height="75" rx="10" fill="url(#calBody)" stroke="rgba(140,200,255,0.6)" stroke-width="1.6"/>
          <circle cx="38" cy="16" r="4.2" fill="none" stroke="rgba(200,220,255,0.7)" stroke-width="1.6"/>
          <circle cx="72" cy="16" r="4.2" fill="none" stroke="rgba(200,220,255,0.7)" stroke-width="1.6"/>
          <g fill="rgba(255,255,255,0.7)">
            <rect x="32" y="32" width="8" height="8" rx="1.6"/>
            <rect x="44" y="32" width="8" height="8" rx="1.6"/>
            <rect x="56" y="32" width="8" height="8" rx="1.6"/>
            <rect x="68" y="32" width="8" height="8" rx="1.6"/>
            <rect x="32" y="45" width="8" height="8" rx="1.6"/>
            <rect x="44" y="45" width="8" height="8" rx="1.6"/>
            <rect x="56" y="45" width="8" height="8" rx="1.6"/>
            <rect x="68" y="45" width="8" height="8" rx="1.6"/>
            <rect x="32" y="58" width="8" height="8" rx="1.6"/>
            <rect x="44" y="58" width="8" height="8" rx="1.6"/>
            <rect x="56" y="58" width="8" height="8" rx="1.6"/>
            <rect x="68" y="58" width="8" height="8" rx="1.6"/>
          </g>
          <circle cx="86" cy="82" r="14" fill="url(#clockFill)" stroke="rgba(200,180,255,0.6)" stroke-width="1.5"/>
          <path d="M86 74.5v8.2l5.2 3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="86" cy="82" r="1.4" fill="#ffffff"/>
          <g fill="rgba(200,220,255,0.8)">
            <path d="M18 28 19.4 31.4 22.8 32.8 19.4 34.2 18 37.6 16.6 34.2 13.2 32.8 16.6 31.4z"/>
            <path d="M96 22 97.2 25 100.2 26.2 97.2 27.4 96 30.4 94.8 27.4 91.8 26.2 94.8 25z"/>
            <path d="M12 68 13.1 70.8 15.9 71.9 13.1 73 12 75.8 10.9 73 8.1 71.9 10.9 70.8z"/>
          </g>
        </svg>
        <div class="hero-copy">
          <span class="tag" id="meeting-tag">جلسه</span>
          <h2 id="meeting-title">جلسه</h2>
          <p id="meeting-lead">در حال بارگذاری...</p>
        </div>
      </div>

      <div class="info-row">
        <div class="info">
          <span class="info-ico" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="5.2" stroke="#4ad4ff" stroke-width="1.4"/>
              <path d="M4.2 7.2 6.1 9 9.8 5.2" stroke="#4ad4ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div class="info-text">
            <span class="info-label">وضعیت</span>
            <span class="info-value" id="meeting-status">—</span>
          </div>
        </div>
        <div class="info">
          <span class="info-ico" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 12.2s4.2-3.4 4.2-6.4A4.2 4.2 0 1 0 2.8 5.8c0 3 4.2 6.4 4.2 6.4z" stroke="#4ad4ff" stroke-width="1.3" stroke-linejoin="round"/>
              <circle cx="7" cy="5.8" r="1.35" stroke="#4ad4ff" stroke-width="1.2"/>
            </svg>
          </span>
          <div class="info-text">
            <span class="info-label">مکان</span>
            <span class="info-value" id="meeting-location">—</span>
          </div>
        </div>
        <div class="info">
          <span class="info-ico" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="5.2" stroke="#4ad4ff" stroke-width="1.4"/>
              <path d="M7 4.2V7l2.2 1.4" stroke="#4ad4ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div class="info-text">
            <span class="info-label">ساعت</span>
            <span class="info-value" id="meeting-time">—</span>
          </div>
        </div>
        <div class="info">
          <span class="info-ico" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="1.8" y="2.6" width="10.4" height="9.2" rx="1.4" stroke="#4ad4ff" stroke-width="1.3"/>
              <path d="M1.8 5.4h10.4M4.4 1.7v2.2M9.6 1.7v2.2" stroke="#4ad4ff" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </span>
          <div class="info-text">
            <span class="info-label">تاریخ برگزاری</span>
            <span class="info-value" id="meeting-date">—</span>
          </div>
        </div>
      </div>
    </section>

    <nav class="tabs" aria-label="بخش‌های جلسه">
      <button class="tab on" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M4.2 2.2h5.2L12.4 5.2V13a1.1 1.1 0 0 1-1.1 1.1H4.2A1.1 1.1 0 0 1 3.1 13V3.3A1.1 1.1 0 0 1 4.2 2.2z" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M9.3 2.3V5.3h3M5.4 8.2h5.2M5.4 10.6h5.2" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        خلاصه جلسه
      </button>
      <button class="tab" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="6.2" cy="5.4" r="1.8" stroke="rgba(255,255,255,0.55)" stroke-width="1.3"/>
          <path d="M2.8 12.2c.7-2 2-3 3.4-3s2.7 1 3.4 3" stroke="rgba(255,255,255,0.55)" stroke-width="1.3" stroke-linecap="round"/>
