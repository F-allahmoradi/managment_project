<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نظر و جستجو</title>
  <link rel="stylesheet" href="fonts/vazirmatn.css">
  <link rel="stylesheet" href="mobile-shell.css">
  <link rel="stylesheet" href="mobile-ui.css">
  <script src="mobile-session.js"></script>
  <script>MobileSession.redirectIfAnonymous();</script>
</head>
<body data-page="reports">
  <main class="screen">
    <div class="status"><time>سامانه</time></div>
    <header class="header">
      <a class="back" href="admin-mobile.html" aria-label="بازگشت">→</a>
      <h1>نظر و جستجو</h1>
      <span style="width:38px"></span>
    </header>
    <div class="search-box">
      <input id="search-query" type="search" placeholder="جستجوی واژه‌ای در جلسات و پیام‌ها">
      <button id="search-go" type="button">جستجو</button>
    </div>
    <div id="search-list"></div>
    <section class="form-card" id="semantic-panel">
      <h2>امبدینگ و جستجوی معنایی</h2>
      <p>تحلیل‌های ذخیره‌شده بردار می‌شوند. سؤال را بنویسید تا نزدیک‌ترین متن خام، موجودیت و نیت بیاید.</p>
      <div class="search-box inset">
        <input id="semantic-query" type="search" placeholder="مثلاً تأخیر پرداخت یا قطع سرور" aria-label="جستجوی معنایی">
        <button id="semantic-go" type="button">جستجو</button>
      </div>
      <button class="ghost-btn" id="embed-pending" type="button">امبد کردن تحلیل‌های مانده</button>
      <p id="embed-status"></p>
      <div id="semantic-list"></div>
    </section>
    <form class="form-card" id="report-form">
      <h2>ثبت نظر خام</h2>
      <p>متن با پروژه، وظیفه و کاربر ذخیره می‌شود. بعد همان متن استخراج می‌شود و تحلیل پیشنهادی ذخیره می‌گردد.</p>
      <div class="field">
        <label for="report-project">پروژه</label>
        <select id="report-project" required></select>
      </div>
      <div class="field">
        <label for="report-task">وظیفه</label>
        <select id="report-task" required></select>
      </div>
      <div class="field">
        <label for="report-body">متن</label>
        <textarea id="report-body" required placeholder="نظر را بنویسید یا با دکمه صدا بگویید"></textarea>
      </div>
      <button class="ghost-btn" id="report-voice" type="button" style="width:100%;margin:12px 0 0">ضبط صدا</button>
      <button class="primary-btn" type="submit" style="width:100%;margin:12px 0 0">ذخیره پیام</button>
    </form>
  </main>
  <nav class="bnav">
    <a class="nitem" href="admin-mobile.html"><span>خانه</span></a>
    <a class="nitem" href="projects.html"><span>پروژه‌ها</span></a>
    <a class="nitem" href="meetings.html"><span>جلسات</span></a>
    <a class="nitem" href="tasks.html"><span>وظایف</span></a>
    <a class="nitem on" href="reports.html"><span>گزارش‌ها</span></a>
  </nav>
  <script src="mobile-app.js"></script>
</body>
</html>
