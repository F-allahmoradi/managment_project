<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

  <title>گزارش</title>
  <link rel="stylesheet" href="fonts/vazirmatn.css">
  <link rel="stylesheet" href="mobile-shell.css">
  <link rel="stylesheet" href="mobile-ui.css">
  <script src="mobile-session.js"></script>
  <script>MobileSession.redirectIfAnonymous();</script>
</head>
<body data-page="reports">
  <main class="screen">
    <div class="status"><time>سامانه</time></div>
    <header class="header">
      <a class="back" id="reports-back" href="admin-mobile.html" aria-label="بازگشت">→</a>
      <h1 id="reports-title">گزارش</h1>
      <span style="width:38px"></span>
    </header>
    <nav class="form-card report-fold" id="reports-tools" aria-label="ابزار گزارش">
      <a class="report-tool" href="projects.html">پروژه‌ها</a>
      <a class="report-tool" href="meetings.html">جلسات</a>
      <a class="report-tool" href="embedding.html">امبدینگ</a>
      <a class="report-tool" href="semantic.html">جستجوی معنایی</a>
      <a class="report-tool" href="raw-comment.html">ثبت نظر خام</a>
    </nav>
    <form class="form-card" id="report-form">
      <h2>ثبت گزارش</h2>
      <p>گزارش به پروژه وصل می‌شود. موجودیت‌ها از متن استخراج می‌شوند.</p>
      <div class="field">
        <label for="report-project">پروژه</label>
        <select id="report-project" required></select>
      </div>
      <div class="field">
        <label for="report-body">متن</label>
        <textarea id="report-body" required placeholder="گزارش را بنویسید یا با دکمه صدا بگویید"></textarea>
      </div>
      <button class="ghost-btn" id="report-voice" type="button" style="width:100%;margin:12px 0 0">ضبط صدا</button>
      <button class="primary-btn" type="submit" style="width:100%;margin:12px 0 0">ثبت گزارش</button>
    </form>
  </main>
  <nav class="bnav">
    <a class="nitem" href="admin-mobile.html"><span>خانه</span></a>
    <a class="nitem" href="projects.html"><span>پروژه‌ها</span></a>
