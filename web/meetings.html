<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>جلسات</title>
  <link rel="stylesheet" href="fonts/vazirmatn.css">
  <link rel="stylesheet" href="mobile-ui.css">
  <script src="mobile-session.js"></script>
  <script>MobileSession.redirectIfAnonymous();</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: radial-gradient(ellipse at 20% 10%, #0d2050 0%, #081230 30%, #030614 70%, #010308 100%);
      font-family: "Vazirmatn", sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; background: none; border: none; color: inherit; cursor: pointer; }

    .screen {
      width: min(430px, 100%);
      padding-top: env(safe-area-inset-top);
      min-height: 100dvh;
      overflow-y: auto;
      padding-bottom: 100px;
      scrollbar-width: none;
    }
    .screen::-webkit-scrollbar { width: 0; height: 0; }


    .header {
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }
    .back {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(20, 40, 80, 0.7);
      border: 1px solid rgba(100, 180, 255, 0.35);
      box-shadow: 0 0 10px rgba(80, 160, 255, 0.2);
      display: grid;
      place-items: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    .meet {
      display: block;
      margin: 12px 16px 0;
      border-radius: 18px;
      padding: 16px 18px;
      background: linear-gradient(160deg, rgba(30, 55, 120, 0.92) 0%, rgba(15, 30, 70, 0.96) 100%);
      border: 1px solid rgba(100, 180, 255, 0.35);
      box-shadow: 0 0 20px rgba(80, 160, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .meet:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 26px rgba(80, 160, 255, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1a6a4a, #2a8a5a);
      border: 1px solid rgba(80, 220, 140, 0.5);
      font-size: 11px;
      font-weight: 600;
      color: #a0ffc0;
      margin-bottom: 8px;
    }
    .tag.wait {
      background: linear-gradient(135deg, #3a4a8a, #4a6aaa);
      border-color: rgba(100, 180, 255, 0.5);
      color: #a8d4ff;
    }
    .meet h2 { font-size: 15px; font-weight: 700; line-height: 1.5; }
    .meet p {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.7;
    }
    .meta {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
    }
    .meta span { color: rgba(255, 255, 255, 0.5); font-weight: 400; }

    .bnav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(430px, 100%);
      height: 80px;
      background: linear-gradient(180deg, rgba(10, 25, 55, 0.95), rgba(5, 12, 30, 0.98));
      border-top: 1px solid rgba(80, 160, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
    }
    .nitem {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: rgba(255, 255, 255, 0.45);
    }
    .nitem span { font-size: 10px; }
    .nitem.on { color: #4ad4ff; }
    .nitem.on span { font-weight: 600; color: #4ad4ff; }
    .nitem.on svg { filter: drop-shadow(0 0 8px rgba(74, 212, 255, 0.55)); }
  </style>
</head>
<body data-page="meetings">
  <main class="screen">
    <header class="header">
      <a class="back" href="admin-mobile.html" aria-label="بازگشت">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M7.2 3.4 13 9l-5.8 5.6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1>جلسات</h1>
      <div class="header-actions">
        <button class="back" id="import-calendar" type="button" aria-label="ورود از تقویم گوگل">تقویم</button>
        <a class="back" href="new-meeting.html" aria-label="جلسه جدید">+</a>
      </div>
    </header>

    <button class="cal-import" id="import-calendar-bar" type="button">ورود زمان جلسات از تقویم گوگل</button>
    <div id="meeting-list"></div>
  </main>

  <nav class="bnav" aria-label="ناوبری">
    <a class="nitem" href="admin-mobile.html">

        <path d="M3.4 10.6 12 3.6l8.6 7v8.2a1.6 1.6 0 0 1-1.6 1.6h-4.2v-5.4H9.2v5.4H5a1.6 1.6 0 0 1-1.6-1.6v-8.2z" stroke="rgba(255,255,255,0.45)" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      <span>خانه</span>
    </a>
    <a class="nitem" href="projects.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3.2 8.2c0-1.15.95-2.1 2.1-2.1h3.3l1.7 1.8h8.4c1.15 0 2.1.95 2.1 2.1v7.2c0 1.15-.95 2.1-2.1 2.1H5.3c-1.15 0-2.1-.95-2.1-2.1V8.2z" stroke="rgba(255,255,255,0.45)" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      <span>پروژه‌ها</span>
    </a>
    <a class="nitem on" href="meetings.html" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.4" y="5" width="17.2" height="15.2" rx="2.2" stroke="#4ad4ff" stroke-width="1.7"/>
        <path d="M3.4 9.6h17.2M8 3.3v3.2M16 3.3v3.2" stroke="#4ad4ff" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>جلسات</span>
    </a>
    <a class="nitem" href="tasks.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.4" y="3.4" width="7.2" height="7.2" rx="1.4" stroke="rgba(255,255,255,0.45)" stroke-width="1.7"/>
        <rect x="13.4" y="3.4" width="7.2" height="7.2" rx="1.4" stroke="rgba(255,255,255,0.45)" stroke-width="1.7"/>
        <rect x="3.4" y="13.4" width="7.2" height="7.2" rx="1.4" stroke="rgba(255,255,255,0.45)" stroke-width="1.7"/>
        <rect x="13.4" y="13.4" width="7.2" height="7.2" rx="1.4" stroke="rgba(255,255,255,0.45)" stroke-width="1.7"/>
      </svg>
      <span>وظایف</span>
    </a>
    <a class="nitem" href="reports.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 3.6h7.2L19 8.4V20a1.6 1.6 0 0 1-1.6 1.6H7A1.6 1.6 0 0 1 5.4 20V5.2A1.6 1.6 0 0 1 7 3.6z" stroke="rgba(255,255,255,0.45)" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M14 3.8V8.6H19M8.4 12.2h7.2M8.4 15.6h7.2" stroke="rgba(255,255,255,0.45)" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>گزارش‌ها</span>
    </a>
    <a class="nitem" href="members-groups.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="9" cy="8.2" r="2.5" stroke="rgba(255,255,255,0.45)" stroke-width="1.7"/>
        <path d="M4.2 18.4c.9-2.7 2.7-4 4.8-4s3.9 1.3 4.8 4" stroke="rgba(255,255,255,0.45)" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="16.5" cy="8.8" r="2" stroke="rgba(255,255,255,0.45)" stroke-width="1.7"/>
        <path d="M15.2 14.4c1.4.25 2.6 1.15 3.3 2.8" stroke="rgba(255,255,255,0.45)" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>اعضا</span>
    </a>
  </nav>
  <script src="mobile-app.js"></script>
</body>
</html>
