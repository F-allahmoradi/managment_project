<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>جزئیات پروژه</title>
  <link rel="stylesheet" href="fonts/vazirmatn.css">
  <link rel="stylesheet" href="mobile-shell.css">
  <link rel="stylesheet" href="mobile-ui.css">
  <script src="mobile-session.js"></script>
  <script>MobileSession.redirectIfAnonymous();</script>
  <style>
    body[data-page="project-details"] .hdr-edit {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 19px;
      background: rgba(20, 40, 80, 0.7);
      border: 1px solid rgba(100, 180, 255, 0.35);
      box-shadow: 0 0 10px rgba(80, 160, 255, 0.2);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }
    body[data-page="project-details"] .hdr-edit[hidden] {
      display: none;
    }
    body[data-page="project-details"] .pd-hero {
      margin: 12px 16px 0;
      max-width: calc(100% - 32px);
      min-width: 0;
      border-radius: 20px;
      padding: 18px;
      background: linear-gradient(160deg, rgba(25, 50, 110, 0.9) 0%, rgba(12, 25, 60, 0.95) 100%);
      border: 1px solid rgba(100, 180, 255, 0.3);
      box-shadow: 0 0 30px rgba(80, 160, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    body[data-page="project-details"] .hero-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    body[data-page="project-details"] .folder-art { flex: none; overflow: visible; width: 90px; height: 90px; }
    body[data-page="project-details"] .folder-art svg { display: block; }
    body[data-page="project-details"] .hero-copy { flex: 1; min-width: 0; }
    body[data-page="project-details"] .status-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1a6a3a, #2a8a4a);
      border: 1px solid rgba(80, 220, 120, 0.5);
      font-size: 11px;
      font-weight: 600;
      color: #a0ffc0;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    body[data-page="project-details"] .hero-copy h2 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      line-height: 1.5;
    }
    body[data-page="project-details"] .hero-copy p {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.7;
    }
    body[data-page="project-details"] .stats {
      margin-top: 16px;
      display: flex;
      align-items: flex-start;
      border-top: 1px solid rgba(100, 180, 255, 0.15);
      padding-top: 12px;
    }
    body[data-page="project-details"] .stat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-align: center;
    }
    body[data-page="project-details"] .stat-ico {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
    }
    body[data-page="project-details"] .stat-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.25;
    }
    body[data-page="project-details"] a.stat {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    body[data-page="project-details"] a.stat:active {
      opacity: 0.82;
    }
    body[data-page="project-details"] .stat-value {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    body[data-page="project-details"] .pd-actions {
      margin: 12px 16px 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
      padding: 3px;
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(25, 45, 95, 0.92), rgba(12, 22, 55, 0.96));
      border: 1px solid rgba(100, 180, 255, 0.32);
      box-shadow: 0 0 25px rgba(80, 140, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    body[data-page="project-details"] .pd-action {
      min-height: 40px;
      border-radius: 9px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      color: rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }
    body[data-page="project-details"] .pd-action:active {
      background: linear-gradient(135deg, #2a5acc, #6a3acc);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(120, 80, 255, 0.45);
    }
  </style>
</head>
<body data-page="project-details">
  <main class="screen">
    <div class="status"><time>سامانه</time></div>
    <header class="header">
      <a class="back" href="projects.html" aria-label="بازگشت">→</a>
      <h1>جزئیات پروژه</h1>
      <a class="hdr-edit" id="project-edit" href="new-project-mobile.html" hidden>ویرایش</a>
    </header>
    <section class="pd-hero">
      <div class="hero-top">
        <div class="folder-art" aria-hidden="true">
          <svg width="90" height="90" viewBox="0 0 90 90">
            <defs>
              <linearGradient id="pedFill" x1="45" y1="66" x2="45" y2="86" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1a4a8a"/>
                <stop offset="100%" stop-color="#0a2050"/>
              </linearGradient>
              <linearGradient id="foldBack" x1="20" y1="10" x2="70" y2="65" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2a5aaa"/>
                <stop offset="100%" stop-color="#1a3a7a"/>
              </linearGradient>
              <linearGradient id="foldFront" x1="25" y1="20" x2="70" y2="65" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#3a7acc"/>
                <stop offset="100%" stop-color="#2a5aaa"/>
              </linearGradient>
              <linearGradient id="checkFill" x1="53" y1="47" x2="75" y2="69" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#4a9aff"/>
                <stop offset="100%" stop-color="#2a6acc"/>
              </linearGradient>
              <filter id="ringBlur" x="-40%" y="-80%" width="180%" height="260%">
                <feGaussianBlur stdDeviation="1.6"/>
              </filter>
              <filter id="folderNeon" x="-35%" y="-25%" width="170%" height="160%">
                <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="rgb(80,160,255)" flood-opacity="0.6"/>
              </filter>
            </defs>
            <ellipse cx="45" cy="72" rx="37.5" ry="9" fill="none" stroke="rgba(100,200,255,0.5)" stroke-width="1.6" filter="url(#ringBlur)"/>
            <ellipse cx="45" cy="76" rx="35" ry="7" fill="url(#pedFill)" stroke="rgba(100,180,255,0.4)"/>
            <g filter="url(#folderNeon)">
              <rect x="20" y="10" width="50" height="55" rx="8" fill="url(#foldBack)" stroke="rgba(100,180,255,0.4)"/>
              <rect x="25" y="20" width="45" height="45" rx="7" fill="url(#foldFront)" stroke="rgba(140,200,255,0.5)"/>
              <path d="M34 33.5h26M34 41.5h26M34 49.5h18" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="64" cy="58" r="11" fill="url(#checkFill)" stroke="rgba(200,230,255,0.6)"/>
              <path d="M58.4 58.1 62.3 62.1 70.1 54.1" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
        <div class="hero-copy">
          <span class="status-pill" id="project-status-pill">—</span>
          <h2 id="project-title">پروژه</h2>
          <p id="project-lead">در حال بارگذاری...</p>
        </div>
      </div>
      <div class="stats">
        <a class="stat" id="tab-progress" href="progress.html">
          <div class="stat-ico" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28">
              <circle cx="14" cy="14" r="11" fill="none" stroke="rgba(100,180,255,0.15)" stroke-width="3"/>
              <circle id="project-progress-ring" cx="14" cy="14" r="11" fill="none" stroke="#4ad4ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 69.12" transform="rotate(-90 14 14)"/>
            </svg>
          </div>
          <span class="stat-label">پیشرفت</span>
          <span class="stat-value" id="project-progress">—</span>
        </a>
        <a class="stat" id="tab-team" href="project-team.html" aria-label="تیم پروژه">
          <div class="stat-ico" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="9" cy="8.2" r="2.5" stroke="rgba(140,200,255,0.7)" stroke-width="1.7"/>
              <path d="M4.2 18.2c.9-2.8 2.8-4.1 4.8-4.1s3.9 1.3 4.8 4.1" stroke="rgba(140,200,255,0.7)" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="16.6" cy="9" r="2" stroke="rgba(140,200,255,0.7)" stroke-width="1.7"/>
              <path d="M15.2 14.2c1.5.25 2.7 1.15 3.4 2.8" stroke="rgba(140,200,255,0.7)" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="stat-label">تیم پروژه</span>
          <span class="stat-value" id="project-team-count">—</span>
        </a>
        <div class="stat">
          <div class="stat-ico" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="3.6" y="5.2" width="16.8" height="15" rx="2" stroke="rgba(140,200,255,0.7)" stroke-width="1.7"/>
              <path d="M3.6 9.4h16.8M8 3.4v3.2M16 3.4v3.2" stroke="rgba(140,200,255,0.7)" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="stat-label">مهلت</span>
          <span class="stat-value" id="project-end">—</span>
        </div>
        <div class="stat">
          <div class="stat-ico" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="7.4" stroke="rgba(140,200,255,0.7)" stroke-width="1.7"/>
              <path d="M12 8.2V12l2.8 1.8" stroke="rgba(140,200,255,0.7)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="stat-label">تاریخ شروع</span>
          <span class="stat-value" id="project-start">—</span>
        </div>
      </div>
    </section>
    <nav class="pd-actions" aria-label="بخش‌های پروژه">
      <a class="pd-action" id="project-new-meeting" href="new-meeting.html">ثبت جلسه</a>
      <a class="pd-action" id="tab-note" href="project-note.html">گزارش</a>
    </nav>
  </main>
  <nav class="bnav">
    <a class="nitem" href="admin-mobile.html"><span>خانه</span></a>
    <a class="nitem on" href="projects.html"><span>پروژه‌ها</span></a>
    <a class="nitem" href="meetings.html"><span>جلسات</span></a>
    <a class="nitem" href="tasks.html"><span>وظایف</span></a>
    <a class="nitem" href="reports.html"><span>گزارش‌ها</span></a>
    <a class="nitem" id="tab-people" href="members-groups.html"><span>اعضا و گروه‌ها</span></a>
  </nav>
  <script src="mobile-app.js"></script>
</body>
</html>
