<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ورود | سامانه مدیریت هوشمند</title>
  <link rel="stylesheet" href="fonts/vazirmatn.css">
  <script src="mobile-session.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    html, body {
      min-height: 100%;
      background: radial-gradient(ellipse at 20% 50%, #0a1a3a 0%, #050a1a 40%, #02040a 100%);
      font-family: "Vazirmatn", sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    button, input { font-family: inherit; }

    .screen {
      width: min(430px, 100%);
      padding-top: env(safe-area-inset-top);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: 28px;
    }

    .brand {
      padding: 8px 24px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }
    .brand p {
      margin-top: 2px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
    }

    .card {
      margin: 0 20px;
      border-radius: 24px;
      padding: 18px 16px 16px;
      background: linear-gradient(160deg, rgba(20, 40, 80, 0.95) 0%, rgba(10, 20, 50, 0.98) 100%);
      border: 1px solid rgba(100, 180, 255, 0.35);
      box-shadow: 0 0 40px rgba(80, 160, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(5, 15, 35, 0.7);
      border: 1px solid rgba(80, 160, 255, 0.25);
    }
    .tabs button {
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .tabs button.is-active {
      color: #fff;
      background: linear-gradient(135deg, #1a4a8a, #2a6ad4);
      box-shadow: 0 0 16px rgba(80, 160, 255, 0.35);
    }

    form { display: flex; flex-direction: column; gap: 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.72);
    }
    .label-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .optional { font-size: 11px; color: rgba(255, 255, 255, 0.4); }
    input {
      height: 46px;
      border-radius: 14px;
      border: 1px solid rgba(100, 180, 255, 0.35);
      background: rgba(5, 15, 35, 0.75);
      color: #fff;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: rgba(120, 200, 255, 0.8);
      box-shadow: 0 0 0 3px rgba(80, 160, 255, 0.2);
    }

    .note {
      font-size: 11px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.5);
    }
    .error {
      min-height: 0;
      font-size: 13px;
      line-height: 1.6;
      color: #ffb4c0;
    }
    .submit {
      height: 50px;
      border: 1px solid rgba(160, 120, 255, 0.55);
      border-radius: 16px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #3a1a6a 0%, #5a2a9a 50%, #7a3aaa 100%);
      box-shadow: 0 0 20px rgba(140, 100, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .submit:disabled { opacity: 0.65; cursor: default; }
  </style>
</head>
<body>
  <main class="screen">

    <div class="brand">
      <svg width="42" height="42" viewBox="0 0 36 36" fill="none" stroke="#4aa8ff" stroke-width="1.35" stroke-linejoin="round" aria-hidden="true">
        <polygon points="18,2.2 32.2,10.4 32.2,25.6 18,33.8 3.8,25.6 3.8,10.4"/>
        <polygon points="18,9.2 26.6,14.2 26.6,23.2 18,28.2 9.4,23.2 9.4,14.2"/>
        <circle cx="18" cy="18.6" r="1.7" fill="#4aa8ff" stroke="none"/>
      </svg>
      <div>
        <h1>سامانه مدیریت هوشمند سازمان‌ها</h1>
        <p id="auth-lead">ورود با حساب سامانه</p>
      </div>
    </div>

    <section class="card" aria-labelledby="auth-lead">
      <div class="tabs" role="tablist" aria-label="ورود یا ثبت‌نام">
        <button type="button" id="tab-login" role="tab" class="is-active" aria-selected="true">ورود</button>
        <button type="button" id="tab-register" role="tab" aria-selected="false">ثبت‌نام</button>
      </div>

      <form id="auth-form" novalidate>
        <label id="server-label">آدرس سرور
          <input id="server-url" dir="ltr" inputmode="url" autocomplete="url" placeholder="http://192.168.1.10:8080" spellcheck="false">
        </label>
        <p class="note" id="server-note">آی‌پی رایانهٔ سرور در همین شبکه، با درگاه ۸۰۸۰. گوشی و رایانه باید روی یک وای‌فای باشند.</p>
        <div class="row" data-register hidden>
          <label>نام<input id="first-name" autocomplete="given-name"></label>
          <label>نام خانوادگی<input id="last-name" autocomplete="family-name"></label>
        </div>
        <label>نام کاربری<input id="username" dir="ltr" autocomplete="username"></label>
        <label>رمز<input id="password" dir="ltr" type="password" autocomplete="current-password"></label>
        <label data-register hidden>تکرار رمز<input id="confirm" dir="ltr" type="password" autocomplete="new-password"></label>
        <div class="row" data-register hidden>
          <label>
            <span class="label-line">تلفن<span class="optional">اختیاری</span></span>
            <input id="phone" dir="ltr" inputmode="tel" autocomplete="tel">
          </label>
          <label>
            <span class="label-line">ایمیل<span class="optional">اختیاری</span></span>
            <input id="email" dir="ltr" type="email" autocomplete="email">
          </label>
        </div>
        <p class="note" data-register hidden>ثبت‌نام حساب می‌سازد. سطح دسترسی داخل پروژه را بعداً مدیر پروژه تعیین می‌کند. اولین حساب سامانه مدیر کل است و مدیر سازمان را او می‌سازد.</p>
        <p class="error" id="auth-error" role="alert" hidden></p>
        <button class="submit" id="submit" type="submit">ورود به سامانه</button>
      </form>
    </section>
  </main>
  <script>
    var mode = "login";
    var form = document.getElementById("auth-form");
    var errorBox = document.getElementById("auth-error");
    var submit = document.getElementById("submit");
    var lead = document.getElementById("auth-lead");
    var registerNodes = document.querySelectorAll("[data-register]");
    var serverLabel = document.getElementById("server-label");
    var serverNote = document.getElementById("server-note");
    var serverField = document.getElementById("server-url");
    var onVite = location.port === "5188";

    if (onVite) {
      serverLabel.hidden = true;
      serverNote.hidden = true;
    } else {
      serverField.value = MobileSession.getApiBase();
    }

    if (MobileSession.getToken()) {
      MobileSession.currentUser().then(function (user) {
        if (user) MobileSession.goHome();
      }).catch(function () {});
    }

    function showError(message) {
      errorBox.hidden = !message;
      errorBox.textContent = message || "";
    }

    function setMode(next) {
      mode = next;
      var isRegister = next === "register";
      document.getElementById("tab-login").classList.toggle("is-active", !isRegister);
      document.getElementById("tab-register").classList.toggle("is-active", isRegister);
      document.getElementById("tab-login").setAttribute("aria-selected", String(!isRegister));
      document.getElementById("tab-register").setAttribute("aria-selected", String(isRegister));
      registerNodes.forEach(function (node) { node.hidden = !isRegister; });
      lead.textContent = isRegister ? "ساخت حساب برای ورود" : "ورود با حساب سامانه";
      submit.textContent = isRegister ? "ساخت حساب" : "ورود به سامانه";
      document.getElementById("password").autocomplete = isRegister ? "new-password" : "current-password";
      showError("");
    }

    document.getElementById("tab-login").addEventListener("click", function () { setMode("login"); });
    document.getElementById("tab-register").addEventListener("click", function () { setMode("register"); });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (submit.disabled) return;
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;
      if (mode === "register") {
        var firstName = document.getElementById("first-name").value.trim();
        var lastName = document.getElementById("last-name").value.trim();
        if (!firstName || !lastName || !username || !password) {
          showError("نام، نام خانوادگی، نام کاربری و رمز لازم است");
          return;
        }
        if (password.length < 8) {
          showError("رمز باید حداقل ۸ نویسه باشد");
          return;
        }
        if (password !== document.getElementById("confirm").value) {
          showError("تکرار رمز با رمز یکی نیست");
          return;
        }
      } else if (!username || !password) {
        showError("نام کاربری و رمز را وارد کنید");
        return;
      }

      if (!onVite) {
        var server = serverField.value.trim();
        if (!server && MobileSession.needsServer()) {
          showError("آدرس سرور را وارد کنید. مثلاً http://192.168.1.10:8080");
          return;
        }
        if (server && MobileSession.setApiBase(server) === null) {
          showError("آدرس سرور باید با http:// یا https:// شروع شود");
          return;
        }
        if (!server) MobileSession.setApiBase("");
      }

      submit.disabled = true;
      submit.textContent = "در حال ارسال...";
      showError("");
      try {
        if (mode === "register") {
          var phone = document.getElementById("phone").value.trim();
          var email = document.getElementById("email").value.trim();
          var fields = {
            first_name: firstName,
            last_name: lastName,
            username: username,
            password: password,
          };
          if (phone) fields.phone = phone;
          if (email) fields.email = email;
          await MobileSession.registerAccount(fields);
        } else {
          await MobileSession.login(username, password);
        }
        MobileSession.goHome();
      } catch (error) {
        showError(error.message || "درخواست ناموفق بود");
        submit.disabled = false;
        submit.textContent = mode === "register" ? "ساخت حساب" : "ورود به سامانه";
      }
    });
  </script>
</body>
</html>
