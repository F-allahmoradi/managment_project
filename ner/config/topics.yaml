# درخت حوزه برای استخراج موضوع / کلمهٔ کلیدی.
# کدها همان topics در seed هستند؛ ردیف جدید در YAML یعنی موضوع جدید.
# cues فقط برای تطبیق متن است؛ در دیتابیس ذخیره نمی‌شود.
# تعریف و contrast مثل discourse.yaml برای مدل است، نه برای INSERT.
# اگر هیچ گرهٔ کاتالوگ نخورَد، موضوع واقعی متن کشف می‌شود و حذف نمی‌شود.

discovery:
  enabled: true
  persist: true
  do_not_force_fit: true
  catalog_file: discovered_topics.yaml
  rules:
    - اگر تعریف یکی از گره‌های زیر با متن بخواند همان را بزن؛ موضوع جدید نساز.
    - اگر هیچ گره نخورد، موضوع واقعی حرف را با نام فارسی و تعریف کوتاه از متن درآور؛ آرایه را خالی نگذار.
    - موضوع نو را به نزدیک‌ترین گره تقلیل نده و در management نریز.
    - کد انگلیسی کوچک با زیرخط؛ نام فارسی کوتاه؛ شاهد mention_text باید داخل متن باشد.

topics:
  - code: finance
    name: مالی
    level: 1
    definition: پول پروژه؛ بودجه، هزینه، حساب و صورت‌وضعیت، نه لزوماً خودِ واریز.
    description: >
      مالی وقتی است که بحث عدد پول، بودجه واحد، هزینه یا صورت‌وضعیت باشد.
      اگر خود عمل پرداخت یا تأخیر آن موضوع اصلی است، برگ پرداخت را بزن نه همین ریشه را.
    contrast:
      - عمل واریز یا طلب پرداخت → finance.payment
      - دیرکرد همان واریز → finance.payment.delay
      - خرید از پیمانکار بدون رقم مالی → procurement
    accept_example: بودجه این فاز تمام شده و هزینه نگهداری بالا رفته.
    reject_example: پیمانکار سه هفته است صورت‌وضعیت را نگرفته.
    cues:
      - واحد مالی
      - مالی
      - بودجه
      - هزینه
      - صورت‌وضعیت

  - code: finance.payment
    name: پرداخت
    level: 2
    definition: عمل واریز، تسویه یا آزاد کردن پول به ذی‌نفع.
    description: >
      پرداخت خودِ جابه‌جایی پول است: واریز، تسویه، آزادسازی صورت‌وضعیت.
      اگر فقط بودجه یا هزینه است و خبری از واریز نیست، همان مالی بماند.
      اگر مشکل اصلی دیرکرد همان واریز است، برگ تأخیر پرداخت را بزن.
    contrast:
      - بودجه و هزینه بدون واریز → finance
      - دیرکرد یا معوق بودن همان واریز → finance.payment.delay
    accept_example: واحد مالی باید پرداخت پیمانکار را آزاد کند.
    reject_example: بودجه فاز دو کم آمده.
    cues:
      - پرداخت
      - واریز

  - code: finance.payment.delay
    name: تأخیر پرداخت
    level: 3
    definition: دیرکرد، معوق بودن یا عقب افتادن همان واریز.
    description: >
      فقط وقتی بزن که تأخیر خودِ پرداخت موضوع باشد، نه هر تأخیری در پروژه.
      تأخیر تحویل کالا یا تأخیر کار فنی اینجا نیست.
    contrast:
      - واریز به‌موقع یا بدون دیرکرد → finance.payment
      - تأخیر تحویل یا کار فنی → tech یا procurement
    accept_example: سه هفته تأخیر در پرداخت صورت‌وضعیت پیمانکار.
    reject_example: سرور از دیشب قطع است.
    cues:
      - تأخیر پرداخت
      - دیرکرد
      - سه هفته تأخیر

  - code: tech
    name: فنی
    level: 1
    definition: کار فنی و زیرساخت به‌صورت کلی، وقتی برگ نرم‌افزار یا سخت‌افزار دقیق نیست.
    description: >
      فنی ریشهٔ حوزهٔ مهندسی است. اگر نرم‌افزار، سخت‌افزار، تست یا احراز هویت
      مشخص است همان برگ را بزن؛ ریشه را فقط برای حرف کلی فنی نگه دار.
    contrast:
      - برنامه، داشبورد، اسپرینت → tech.software
      - سرور، برق، دیسک، قطعی سخت‌افزار → tech.hardware
      - آزمون کیفیت نرم‌افزار → tech.test
    accept_example: واحد فنی باید زیرساخت فاز دو را جمع‌بندی کند.
    reject_example: سرور پشتیبان از دیشب قطع است.
    cues:
      - فنی
      - زیرساخت

  - code: tech.software
    name: نرم‌افزار
    level: 2
    definition: برنامه، داشبورد، اسپرینت و کار توسعهٔ نرم‌افزار.
    description: >
      نرم‌افزار کد، رابط، انتشار و کار تیم توسعه است.
      قطع برق یا دیسک سخت‌افزار است. ورود کاربر و رمز احراز هویت است.
    contrast:
      - سرور، برق، دیسک، قطعه → tech.hardware
      - لاگین، رمز، نشست → tech.software.auth
      - آزمون و کیس تست → tech.test
    accept_example: اسپرینت داشبورد عقب افتاد.
    reject_example: برق اتاق سرور قطع شد.
    cues:
      - نرم‌افزار
      - داشبورد
      - اسپرینت

  - code: tech.hardware
    name: سخت‌افزار
    level: 2
    definition: تجهیزات فیزیکی؛ سرور، دیسک، برق و قطعی دستگاه.
    description: >
      سخت‌افزار خودِ ماشین و برق و قطعه است، نه باگ نرم‌افزار.
      قطع سرویس به‌خاطر کد هنوز نرم‌افزار است؛ قطع برق یا دیسک سخت‌افزار است.
    contrast:
      - باگ، داشبورد، اسپرینت → tech.software
      - قطعی لاگین بدون اشاره به دستگاه → tech.software.auth
    accept_example: سرور پشتیبان از دیشب قطع است و برق اتاق سرور رفته.
    reject_example: دکمهٔ ورود داشبورد کار نمی‌کند.
    cues:
      - سرور
      - سخت‌افزار
      - دیسک
      - برق
      - قطع

  - code: tech.test
    name: تست
    level: 2
    definition: آزمون کیفیت، کیس تست و پذیرش نرم‌افزار یا سیستم.
    description: >
      تست یعنی آزمون و نتیجهٔ آزمون، نه قطعی تولید و نه اسپرینت توسعه.
      اگر فقط از توسعه یا باگ بدون آزمون حرف است نرم‌افزار بزن.
    contrast:
      - توسعه و داشبورد بدون آزمون → tech.software
      - خرابی دستگاه در تولید → tech.hardware
    accept_example: کیس‌های تست ورود هنوز پاس نشده.
    reject_example: اسپرینت داشبورد عقب افتاد.
    cues:
      - تست

  - code: tech.software.auth
    name: احراز هویت
    level: 3
    definition: ورود، نشست، رمز و کنترل دسترسی کاربر به سامانه.
    description: >
      فقط هویت و دسترسی؛ باگ دیگر داشبورد نرم‌افزار عادی است.
      قطع سرور که لاگین را هم از کار انداخته هنوز سخت‌افزار است اگر علت دستگاه باشد.
    contrast:
      - باگ داشبورد بدون ورود → tech.software
      - قطع دستگاه/برق → tech.hardware
    accept_example: لاگین کاربران بعد از تعویض رمز باز نمی‌شود.
    reject_example: نمودار داشبورد غلط نشان می‌دهد.
    cues:
      - احراز هویت
      - لاگین

  - code: sales
    name: فروش
    level: 1
    definition: معامله با مشتری خریدار؛ فروش، قرارداد فروش و پیگیری مشتری.
    description: >
      فروش سمت درآمد از مشتری است. کمپین و برند بازاریابی است.
      مشتری به‌عنوان خریدار فروش است؛ مخاطب تبلیغات بازاریابی است.
    contrast:
      - کمپین، برند، محتوا → marketing
      - خرید از پیمانکار/تأمین‌کننده → procurement
    accept_example: مشتری فاز دو هنوز قرارداد فروش را امضا نکرده.
    reject_example: کمپین اینستاگرام این هفته منتشر می‌شود.
    cues:
      - فروش
      - مشتری

  - code: marketing
    name: بازاریابی
    level: 1
    definition: معرفی، کمپین، برند و جذب مخاطب قبل از معامله.
    description: >
      بازاریابی کار دیده‌شدن است نه بستن قرارداد فروش.
      اگر موضوع امضای مشتری و معامله است فروش بزن.
    contrast:
      - قرارداد و پیگیری مشتری خریدار → sales
    accept_example: کمپین معرفی محصول را برای هفتهٔ بعد آماده کنید.
    reject_example: مشتری هنوز پیش‌پرداخت را نداده.
    cues:
      - بازاریابی

  - code: procurement
    name: تدارکات
    level: 1
    aliases:
      - contractor
    definition: خرید، تأمین و کار با پیمانکار یا فروشندهٔ بیرونی.
    description: >
      تدارکات سمت تأمین است: پیمانکار، خرید کالا/خدمت، سفارش به بیرون.
      مشتری خریدار فروش است. تأخیر پول پیمانکار اگر بحث واریز باشد
      هم‌زمان تأخیر پرداخت هم هست؛ حوزهٔ تأمین را حذف نکن.
    contrast:
      - مشتری خریدار → sales
      - نیروی داخلی استخدام/حقوق → hr
      - فقط دیرکرد واریز بدون خرید/پیمانکار → finance.payment.delay
    accept_example: پیمانکار فاز دو مصالح را نیاورده.
    reject_example: نیروی داخلی واحد فنی کم آمده.
    cues:
      - پیمانکار
      - تدارکات
      - خرید

  - code: hr
    name: منابع انسانی
    level: 1
    definition: نیروی داخلی؛ جذب، حقوق، شیفت و مسائل پرسنل سازمان.
    description: >
      منابع انسانی آدم‌های داخل سازمان است، نه پیمانکار بیرونی.
      کمبود نیرو یا مرخصی و حقوق اینجا است.
    contrast:
      - پیمانکار و خرید بیرونی → procurement
      - هماهنگی کار بدون بحث پرسنل → management
    accept_example: نیروی نگهبان شیفت شب کم داریم.
    reject_example: پیمانکار باید خسارت بدهد.
    cues:
      - منابع انسانی
      - نیرو

  - code: legal
    name: حقوقی
    level: 1
    definition: قرارداد، خسارت، ادعا و صورت‌جلسهٔ قابل استناد حقوقی.
    description: >
      حقوقی وقتی است که حق، خسارت، بند قرارداد یا سند قابل طرح در دعوا باشد.
      صورت‌جلسهٔ هماهنگی پروژه بدون ادعا مدیریت است نه حقوقی.
    contrast:
      - صورت‌جلسه هماهنگی بدون خسارت/قرارداد → management
      - شکایت رسیدگی بدون بند حقوقی → نیت است؛ اگر خسارت/قرارداد هست legal بمان
    accept_example: خسارت قطع برق را طبق قرارداد در صورت‌جلسه می‌خواهم.
    reject_example: مصوبه جلسه این بود که اسکوپ فریز شود.
    cues:
      - خسارت
      - حقوقی
      - قرارداد
      - صورت‌جلسه

  - code: management
    name: هماهنگی و مدیریت
    level: 1
    fallback: true
    definition: پیشبرد کار پروژه؛ هماهنگی، دستور، مصوبه و بی‌هماهنگی بین واحدها.
    description: >
      مدیریت سطل پیش‌فرض برای هر متنی نیست. فقط هماهنگی کار، دستور سازمانی،
      مصوبه و بی‌هماهنگی تیم پروژه. تربیت فرزند، مدرسه، سلامت و زندگی شخصی
      این گره نیست؛ موضوع واقعی متن را با discovered=true نام ببر.
      اگر حوزهٔ مالی/فنی/تدارکات مشخص است همان برگ را بزن؛ مدیریت را کنارش
      فقط وقتی بگذار که خودِ هماهنگی هم موضوع باشد.
    contrast:
      - حوزه مشخص مالی/فنی/تدارکات بدون بحث هماهنگی → همان برگ، نه management
      - زندگی شخصی، تربیت، خانواده، مدرسه، سلامت → موضوع کشف‌شده با نام فارسی متن
      - خسارت و بند قرارداد → legal
    accept_example: بین واحد فنی و پیمانکار بی‌هماهنگی است؛ مدیر پروژه باید دستور بدهد.
    reject_example: برای تربیت فرزند باید حد مشخص گذاشت.
    cues:
      - بی‌هماهنگی
      - هماهنگی
      - مدیر پروژه
      - مصوبه
      - دستور
