# ژانرهایی که از متن کشف شده‌اند و در کاتالوگ اصلی نبوده‌اند.
# با دست حذف نکنید و به قالب‌های discourse.yaml تقلیل ندهید.

discourses:
- code: offer_of_help
  name: اعلام آمادگی برای کمک
  priority: 0
  discovered: true
  definition: اعلام تمایل یا قصد گوینده برای ارائه کمک یا خدمت به یک سازمان یا فرد،
    بدون آنکه درخواستی از طرف مقابل مطرح شده باشد.
