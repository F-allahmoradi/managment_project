  required_slots:
  - name: کمک‌کننده
    description: فردی که اعلام آمادگی برای کمک می‌کند.
  - name: دریافت‌کننده کمک
    description: سازمان یا فردی که کمک به او پیشنهاد می‌شود.
  - name: حوزه یا نوع کمک
    description: زمینه یا نوع خدمتی که قرار است ارائه شود.
  optional_slots:
  - name: فعل کمکی
    description: عمل کمکی که گوینده قصد انجامش را دارد.
  contrast: []
  aliases:
  - اعلام آمادگی برای کمک
