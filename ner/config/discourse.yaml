# ژانر متن / نوع پیام. کدها همان discourse_types فعال در seed هستند.
# مشکل در issue، رخداد در report، اقدام در report یا result ادغام شد.
# نیت گوینده اینجا نیست؛ آن لایه intents.yaml است.
#
# کشف نوع جدید فقط از شاهد داخل متن است. اگر کنش ساخت‌یافته‌ای در هیچ
# قالب زیر نگنجید، به زور در آن‌ها نمی‌رود و به‌عنوان نوع نو با نقش‌های
# خودش نگه داشته می‌شود. نوع کشف‌شده را حذف نکنید.

discovery:
  enabled: true
  persist: true
  do_not_force_fit: true
  require_in_text: true
  min_required_slots: 2
  min_confidence: 0.7
  catalog_file: discovered_discourses.yaml
  rules:
    - اگر نقش اجباری یکی از قالب‌های زیر از متن پر شود همان را بزن؛ نوع جدید نساز.
    - اگر هیچ قالبی (جز پیام) پر نشود ولی کنش مشخص و تکرارپذیر باشد، نوع جدید بساز.
    - نام، تعریف و نقش‌ها را از خود متن درآور؛ شاهد paraphrase نباشد.
    - نوع نو را به نزدیک‌ترین قالب موجود تقلیل نده و حذف نکن.
    - سلام و احوال‌پرسی یا متن بی‌کنش نوع جدید نیست؛ همان message است.
    - کد انگلیسی کوچک با زیرخط؛ نام فارسی؛ دست‌کم دو نقش پرشده از متن.

discourses:
  - code: order
    name: دستور
    priority: 20
    definition: الزام انجام کار از موضع اختیار سازمانی.
    description: >
      دستور وقتی است که گوینده از سمت، قرارداد یا مصوبه حق امر دارد و مخاطب
      موظف است انجام دهد. لحن تعارف یا خواهش آن را به درخواست برمی‌گرداند.
      خودِ انتخاب بین گزینه‌ها تصمیم است؛ امر به فرد مشخص دستور است.
    required_slots:
      - name: آمر دارای اختیار
        description: فرد یا سمتی که حق امر دارد؛ همکار هم‌تراز آمر نیست.
      - name: مأمور موظف
        description: کسی که باید کار را انجام دهد.
      - name: تکلیف
        description: کار مشخصی که الزام شده است.
    optional_slots:
      - name: مبنای اختیار
        description: سمت، قرارداد یا مصوبه‌ای که امر را مشروع می‌کند.
      - name: مهلت
        description: زمان انجام تکلیف.
      - name: پیامد تخلف
        description: نتیجهٔ انجام‌ندادن دستور.
    aliases:
      - دستور
    contrast:
      - اگر اختیار و الزام معلوم نباشد → request
      - اگر فقط انتخاب اعلام شده نه امر به فرد → decision
    accept_example: تا فردا باید صورت‌وضعیت را بفرستید.
    reject_example: لطفاً اگر ممکن است صورت‌وضعیت را بفرستید.

  - code: resolution
    name: مصوبه
    priority: 19
    definition: تصمیم استنادپذیر با مرجع تصویب رسمی یا جمعی.
    description: >
      مصوبه تصمیم فردی در چت نیست؛ باید به جلسه، هیئت یا کارفرما وصل باشد
      تا بعداً بشود به آن استناد کرد. بدون این مرجع همان تصمیم است.
      لازم‌الاجرا بودن معمولاً از بستر تصویب می‌آید نه از لحن گوینده.
    required_slots:
      - name: مرجع تصویب
        description: جلسه، هیئت، کارفرما یا سند رسمی که تصویب کرده است.
      - name: متن مصوب
        description: آنچه تصویب شده و قابل اجرا یا استناد است.
    optional_slots:
      - name: تاریخ یا شناسه جلسه
        description: زمان یا شمارهٔ جلسه‌ای که مصوبه از آن آمده.
      - name: مخاطب اجرایی
        description: واحد یا فردی که باید مصوبه را اجرا کند.
      - name: لازم‌الاجرا بودن
        description: تصریح اینکه از چه زمانی باید اجرا شود.
    aliases:
      - مصوبه
    contrast:
      - بدون مرجع جلسه/هیئت/کارفرما → decision
      - امر مدیر در چت بدون سند → order یا decision
    accept_example: جلسه امروز مصوب کرد که اسکوپ فریز شود.
    reject_example: تصمیم گرفتم اسکوپ را فریز کنیم.

  - code: decision
    name: تصمیم
    priority: 18
    definition: اعلام انتخاب قطعی بین گزینه‌ها که همین حالا گرفته شده است.
    description: >
      تصمیم خبر از انتخاب انجام‌شده است نه توصیه. نشانه‌ها «قرار شد»،
      «تصمیم گرفتیم»، «انتخاب کردیم» است. اگر هنوز «بهتر است» باشد پیشنهاد است.
      اگر آمر کسی را موظف کند دستور است؛ اگر مرجع تصویب رسمی باشد مصوبه است.
    required_slots:
      - name: تصمیم‌گیر
        description: فرد یا جمعی که انتخاب را قطعی کرده است.
      - name: موضوع تصمیم
        description: مسئله یا گزینه‌ای که درباره‌اش تصمیم گرفته شده.
      - name: گزینه انتخاب‌شده
        description: همان چیزی که انتخاب شده، نه پیشنهاد باز.
    optional_slots:
      - name: گزینه‌های ردشده
        description: مسیرهایی که کنار گذاشته شده‌اند.
      - name: مسئول اجرا
        description: کسی که باید تصمیم را پیاده کند.
      - name: زمان اعتبار
        description: از کی تا کی این تصمیم معتبر است.
    aliases:
      - تصمیم
    contrast:
      - هنوز توصیه است نه قطعی → suggestion
      - امر به مأمور است → order
      - مرجع تصویب رسمی دارد → resolution
    accept_example: قرار شد اسپرینت بعد فقط داشبورد باشد.
    reject_example: بهتر است اسپرینت بعد فقط داشبورد باشد.

  - code: request
    name: درخواست
    priority: 17
    definition: طلب انجام کار، مجوز، منبع یا تصمیم بدون اعمال قدرت.
    description: >
      درخواست انتظار کنش دارد ولی الزام سازمانی ندارد. «لطفاً»، «نیاز داریم»،
      «اگر ممکن است» نشانه‌اش است. اگر مطلوب فقط دانستن باشد سؤال است.
      اگر گوینده حق امر داشته باشد و مخاطب موظف باشد دستور است.
    required_slots:
      - name: درخواست‌کننده
        description: کسی که کار، مجوز یا منبع می‌خواهد.
      - name: خواسته عملی
        description: عملی که باید انجام شود، نه فقط یک سؤال.
    optional_slots:
      - name: مخاطب مسئول
        description: کسی که انتظار می‌رود کار را انجام دهد.
      - name: مهلت
        description: زمان مطلوب برای انجام خواسته.
      - name: دلیل
        description: چرا این کار لازم شده است.
    aliases:
      - درخواست
    contrast:
      - مطلوب دانستن است نه عمل → question
      - آمر دارای اختیار الزام می‌کند → order
    accept_example: لطفاً امشب سرور را بالا بیاورید.
    reject_example: وضعیت سرور چیست؟

  - code: question
    name: سؤال
    priority: 16
    definition: طلب دانستن است؛ مطلوب اصلی اطلاعات است نه انجام کار.
    description: >
      سؤال وقتی است که گوینده چیزی را نمی‌داند و جواب می‌خواهد.
      «چرا»، «چیست»، «کجا رسید» معمولاً سؤال‌اند. جمله‌ای که ظاهر پرسشی
      دارد ولی مطلوبش تأیید یا انجام کار است درخواست است نه سؤال.
      سؤال بلاغی («تا کی باید صبر کنیم؟») ژانر مسئله یا بازخورد است نه سؤال.
    required_slots:
      - name: پرسشگر
        description: کسی که می‌خواهد بداند.
      - name: موضوع مجهول
        description: همان چیزی که پاسخ می‌خواهد؛ اگر مجهول نباشد سؤال نیست.
    optional_slots:
      - name: مخاطب پرسش
        description: کسی که باید جواب بدهد.
      - name: نوع جواب مطلوب
        description: بله/خیر، علت، عدد، یا انتخاب بین گزینه‌ها.
      - name: مهلت جواب
        description: تا کی پاسخ لازم است.
    aliases:
      - سؤال
      - سوال
    contrast:
      - اگر مطلوب عمل است → request
      - ظاهر پرسش بدون انتظار جواب → issue یا feedback
    accept_example: علت تأخیر پرداخت چیست؟
    reject_example: می‌شود فردا پرداخت را تأیید کنید؟

  - code: warning
    name: هشدار
    priority: 15
    definition: آگاه‌کردن از ریسک نزدیک یا در حال وقوع و پیامد بی‌عملی.
    description: >
      هشدار دربارهٔ خطری است که هنوز به اختلال قطعی تبدیل نشده یا در آستانه است.
      جهت متن به آینده و پیامد بی‌عملی است. اگر کار همین حالا خوابیده مسئله است.
      خبر خنثی سازمانی بدون عنصر خطر اطلاعیه است.
    required_slots:
      - name: هشداردهنده
        description: کسی که خطر را اعلام می‌کند.
      - name: خطر یا ریسک
        description: تهدید مشخص نزدیک؛ خبر معمولی خطر نیست.
    optional_slots:
      - name: مخاطب در معرض
        description: کسی یا واحدی که خطر متوجه او است.
      - name: پیامد بی‌عملی
        description: اگر کاری نشود چه می‌شود.
      - name: نشانه یا احتمال
        description: قرینه یا احتمال وقوع خطر.
      - name: اقدام پیشگیرانه
        description: کار پیشنهادی برای جلوگیری؛ اگر این غالب شد پیشنهاد/درخواست فرعی است.
    aliases:
      - هشدار
    contrast:
      - خطر رخ داده و کار خوابیده → issue
      - خبر خنثی بدون ریسک → announcement
    accept_example: ممکن است دوشنبه دیسک سرور پر شود.
    reject_example: دیسک سرور پر شد و سایت خوابید.

  - code: solution
    name: راهکار
    priority: 14
    definition: روش حل یک مسئله حاضر در متن یا بافت.
    description: >
      راهکار پاسخِ یک مسئلهٔ مطرح‌شده است نه ایدهٔ آزاد. باید معلوم باشد
      چه مانعی را برطرف می‌کند. بدون مسئلهٔ صریح همان پیشنهاد است.
      طرح خام بدون روش اجرا ایده است.
    required_slots:
      - name: مسئله مرجع
        description: مانعی که این روش برای رفع آن آمده؛ بدون آن راهکار نیست.
      - name: روش حل
        description: کار یا تغییری که مسئله را برطرف می‌کند.
    optional_slots:
      - name: پیشنهاددهنده
        description: کسی که روش را مطرح کرده است.
      - name: منابع لازم
        description: نفر، زمان، پول یا ابزار مورد نیاز.
      - name: اثر انتظاری
        description: پس از اجرا چه تغییری انتظار می‌رود.
    aliases:
      - راهکار
    contrast:
      - بدون مسئله صریح → suggestion
      - طرح نو بدون روش حل → idea
    accept_example: چون پرداخت قفل شده، راهش جدا کردن درگاه تست است.
    reject_example: یک درگاه تست جدا هم بد نیست داشته باشیم.

  - code: suggestion
    name: پیشنهاد
    priority: 13
    definition: توصیه مشخص برای اقدام، معمولاً خطاب به تصمیم‌گیر.
    description: >
      پیشنهاد اقدام روشنی دارد که هنوز قطعی نشده. معمولاً کسی را برای تأیید
      خطاب می‌کند. اگر طرح باز باشد و مسئول اجرا نداشته باشد ایده است.
      اگر مستقیم یک مسئله را حل کند راهکار است. اگر انتخاب شده باشد تصمیم است.
    required_slots:
      - name: پیشنهاددهنده
        description: کسی که توصیه را مطرح می‌کند.
      - name: اقدام پیشنهادی
        description: کار مشخصی که توصیه شده؛ کلی‌گویی کافی نیست.
    optional_slots:
      - name: مخاطب تصمیم‌گیر
        description: کسی که باید این توصیه را بپذیرد یا رد کند.
      - name: دلیل
        description: چرا این اقدام بهتر است.
      - name: هزینه یا ریسک
        description: بهای انجام یا خطر پیشنهاد.
    aliases:
      - پیشنهاد
    contrast:
      - مسئول اجرا و فعل امر ندارد و طرح باز است → idea
      - پاسخ مستقیم یک مسئله است → solution
      - انتخاب قطعی شده → decision
    accept_example: پیشنهاد می‌کنم اسپرینت بعد فقط داشبورد باشد.
    reject_example: چه می‌شود اگر یک داشبورد جدا بسازیم؟

  - code: idea
    name: ایده
    priority: 12
    definition: طرح یک امکان نو بدون خطاب اجرایی و بدون فعل انجام دهید.
    description: >
      ایده امکان تازه‌ای را باز می‌کند ولی هنوز کسی را به اجرا مکلف نمی‌کند.
      «می‌شود»، «چه می‌شد اگر» نشانه‌اش است. به محض خطاب به تصمیم‌گیر با
      اقدام مشخص، پیشنهاد می‌شود.
    required_slots:
      - name: ایده‌پرداز
        description: کسی که امکان نو را مطرح کرده است.
      - name: طرح نو
        description: همان امکان تازه؛ تکرار وضع موجود ایده نیست.
    optional_slots:
      - name: نیاز یا فرصت
        description: زمینه‌ای که ایده از آن آمده است.
      - name: نفع محتمل
        description: فایده‌ای که گوینده برای طرح می‌بیند.
    aliases:
      - ایده
    contrast:
      - خطاب به تصمیم‌گیر با اقدام مشخص → suggestion
    accept_example: می‌شود گزارش را روی نقشه هم دید.
    reject_example: پیشنهاد می‌کنم گزارش را روی نقشه بگذاریم.

  - code: issue
    name: مسئله
    priority: 11
    definition: وضعیت نامطلوب یا مانع کار که نیاز به رسیدگی دارد؛ شامل مشکل و خرابی.
    description: >
      مسئله اختلال یا مانع فعلی کار است؛ شامل خرابی، توقف، تأخیر باز و موضوع
      تصمیم‌نشده. گزارش وضعیت خنثی بدون مانع نیست. ریسک آینده هنوز رخ نداده
      هشدار است. نسبت‌دادن مقصر و طلب جبران نیت شکایت است؛ ژانر می‌تواند مسئله بماند.
    required_slots:
      - name: بیان‌کننده
        description: کسی که اختلال یا مانع را مطرح می‌کند.
      - name: چیز درگیر
        description: سیستم، کار، واحد، قرارداد یا قطعه‌ای که درگیر شده است.
      - name: شرح اختلال یا مانع
        description: چه چیزی خراب، متوقف یا قفل است.
    optional_slots:
      - name: اثر روی کار
        description: این اختلال چه آسیبی به پروژه یا کار زده است.
      - name: زمان شروع یا کشف
        description: از کی شروع شده یا کی فهمیده شده.
      - name: شدت
        description: جدی‌بودن اختلال از نظر گوینده.
      - name: علت محتمل
        description: حدس علت؛ اگر استدلال غالب شد تحلیل فرعی است.
    aliases:
      - مسئله
      - مساله
      - مشکل
      - problem
    contrast:
      - فقط خبر خنثی بدون اختلال → report
      - ریسک آینده است نه اختلال فعلی → warning
      - نیت شکایت جدا است؛ ژانر همین‌جا مسئله می‌ماند
    accept_example: سرور پشتیبان از دیشب قطع است و تسک بسته نشده.
    reject_example: ممکن است فردا سرور قطع شود.

  - code: result
    name: نتیجه
    priority: 10
    definition: حاصل تمام‌شده یک کار، آزمون، مذاکره یا دوره.
    description: >
      نتیجه پایان یک کار را می‌گوید نه مسیر جاری را. «سبز شد»، «تمام شد»،
      «به توافق رسیدیم» نشانه‌اش است. کارِ در جریان گزارش است. اگر مانع
      هنوز پابرجا است مسئله است نه نتیجه.
    required_slots:
      - name: کار یا آزمون مبدأ
        description: همان کاری که به پایان رسیده و حالا حاصلش گفته می‌شود.
      - name: حاصل
        description: خروجی تمام‌شده؛ موفقیت یا شکست هر دو نتیجه‌اند.
    optional_slots:
      - name: عامل یا مجری
        description: کسی که کار را انجام داده است.
      - name: مقایسه با انتظار
        description: حاصل با برنامه یا معیار چه فرقی دارد.
    aliases:
      - نتیجه
    contrast:
      - کار هنوز جاری است → report
      - اختلال باقی است → issue
    accept_example: تست پرداخت سبز شد.
    reject_example: امروز روی پرداخت کار کردیم.

  - code: analysis
    name: تحلیل
    priority: 9
    definition: بررسی مستدل با شاهد و استنتاج؛ بیش از نقل وضعیت است.
    description: >
      تحلیل باید دلیل بیاورد و به جمع‌بندی برسد. نقل وقایع بدون استدلال گزارش است.
      روشن کردن معنای یک بند توضیح است. داوری روی کارِ فرد مشخص بازخورد است.
    required_slots:
      - name: تحلیل‌گر
        description: کسی که بررسی را انجام می‌دهد.
      - name: موضوع تحلیل
        description: آنچه بررسی می‌شود.
      - name: شواهد
        description: داده یا قرینه‌ای که استدلال روی آن سوار است.
      - name: استنتاج
        description: جمع‌بندی یا علتی که از شواهد درآمده است.
    optional_slots:
      - name: سناریوها یا گزینه‌ها
        description: مسیرهای محتمل که با هم مقایسه شده‌اند.
    aliases:
      - تحلیل
    contrast:
      - نقل وضعیت بدون استدلال → report
      - فقط روشن کردن معنا → interpretation
      - داوری روی کار کسی → feedback
    accept_example: سه تأخیر پشت‌سرهم از یک پیمانکار است؛ علت ضعف هماهنگی است نه کمبود نفر.
    reject_example: پیمانکار سه بار تأخیر داشت.

  - code: interpretation
    name: توضیح و تفسیر
    priority: 8
    definition: روشن کردن معنا، علت یا دلالت یک موضوع مبهم؛ نه لزوماً راه‌حل.
    description: >
      توضیح می‌گوید این بند، عدد یا وضعیت یعنی چه. سؤال پنهانش «یعنی چه / چرا
      این‌طور است» است نه «چه باید کرد». اگر وزن‌دهی و جمع‌بندی ساخت‌یافته آمد
      تحلیل است. اگر نسخه اجرایی داد پیشنهاد یا راهکار است.
    required_slots:
      - name: مفسر
        description: کسی که معنا را روشن می‌کند.
      - name: موضوع مبهم
        description: بند قرارداد، عدد، تصمیم یا وضعیتی که نیاز به شرح دارد.
      - name: معنای پیشنهادی
        description: همان شرحی که ابهام را برطرف می‌کند.
    optional_slots:
      - name: مبنای تفسیر
        description: متن، رویه یا تجربه‌ای که تفسیر روی آن استوار است.
    aliases:
      - توضیح و تفسیر
      - توضیح
      - تفسیر
    contrast:
      - وزن‌دهی و جمع‌بندی ساخت‌یافته → analysis
      - پاسخ به چه باید کرد → suggestion یا solution
    accept_example: بند جریمه یعنی تأخیر بیش از سه روز مشمول کسر می‌شود.
    reject_example: باید جریمه را اعمال کنیم.

  - code: feedback
    name: بازخورد
    priority: 7
    definition: ارزیابی کار، رفتار یا خروجی مشخص؛ می‌تواند مثبت یا منفی باشد.
    description: >
      بازخورد داوری روی کار یا خروجیِ مشخص است، مثبت یا منفی. ابژه باید معلوم
      باشد. اگر مقصر بیرونی و خواستهٔ جبران بیاید مسیر شکایت است نه بازخورد.
      علت‌یابی سیستمی بدون داوری فرد تحلیل است.
      تعریف وارونه («شاهکار واحد مالی») بازخورد منفی است نه تعریف.
    required_slots:
      - name: بازخورددهنده
        description: کسی که ارزیابی می‌کند.
      - name: موضوع ارزیابی
        description: کار، فرد، محصول یا جلسه‌ای که درباره‌اش حرف می‌زند.
      - name: داوری
        description: خوب، بد یا مختلط بودن آن کار یا خروجی.
    optional_slots:
      - name: شاهد کار یا خروجی
        description: نمونه یا قرینه‌ای که داوری را نشان می‌دهد.
      - name: توصیه اصلاح
        description: چه تغییری پیشنهاد شده؛ وجودش بازخورد را به پیشنهاد تبدیل نمی‌کند.
    aliases:
      - بازخورد
    contrast:
      - مقصر و خواسته جبران دارد → ژانر issue و نیت complaint
      - بررسی علت سیستمی بدون داوری فرد → analysis
    accept_example: گزارش خوانا نبود؛ بخش مالی را جدا کنید.
    reject_example: پیمانکار خسارت ما را بدهد.

  - code: experience
    name: تجربه
    priority: 6
    definition: روایت زیست‌شده گذشته با پیامد واقعی و درس قابل انتقال.
    description: >
      تجربه گزارشِ چیزی است که قبلاً رخ داده و نتیجه‌اش دیده شده. بدون گذشتهٔ
      زیسته ایده است. بدون پیامد واقعی به گزارش معمولی نزدیک می‌شود.
      درس اگر بیاید ارزش تجربه را کامل می‌کند.
    required_slots:
      - name: راوی
        description: کسی که واقعه را از تجربهٔ خودش می‌گوید.
      - name: موقعیت گذشته
        description: همان رخداد قبلی، نه طرح آینده.
      - name: پیامد واقعی
        description: آنچه پس از آن کار واقعاً رخ داد.
    optional_slots:
      - name: درس
        description: آنچه باید برای بعد برداشته شود.
      - name: اقدامات آن موقع
        description: کارهایی که در آن موقعیت انجام شد.
    aliases:
      - تجربه
    contrast:
      - بدون گذشته زیسته → idea
      - بدون پیامد و درس → report
    accept_example: بار پیش بدون هماهنگی سوئیچ کردیم و یک روز خوابید.
    reject_example: بهتر است هماهنگ سوئیچ کنیم.

  - code: announcement
    name: اطلاعیه
    priority: 5
    definition: ابلاغ یک‌طرفه خبر رسمی به جمع؛ اصل کار دانستن است.
    description: >
      اطلاعیه خبر سازمانی است که جمع باید بدانند؛ ورود، رویه، زمان، تغییر قاعده.
      روایت پیشرفت پروژه گزارش است. اگر عنصر خطر غالب باشد هشدار است.
      انتظار اقدام فوری از یک نفر درخواست است نه اطلاعیه.
    required_slots:
      - name: اعلام‌کننده
        description: فرد یا واحد سازمانی که خبر را ابلاغ می‌کند.
      - name: مخاطب جمعی
        description: گروه دریافت‌کننده، نه یک مسئول واحد برای اجرا.
      - name: خبر ابلاغی
        description: همان مطلبی که باید دانسته شود.
    optional_slots:
      - name: زمان اجرا یا اعتبار
        description: از کی این خبر یا رویه اعمال می‌شود.
    aliases:
      - اطلاعیه
    contrast:
      - روایت پیشرفت یا وقایع کاری → report
      - عنصر خطر غالب است → warning
    accept_example: از شنبه ورود به کارگاه فقط با کارت جدید است.
    reject_example: امروز ورود با کارت قدیمی هم انجام شد.

  - code: report
    name: گزارش
    priority: 4
    definition: روایت وضعیت یا وقایع برای ثبت و آگاهی. رخداد جدا نیست؛ ماده همین گزارش است.
    description: >
      گزارش می‌گوید چه شده یا وضعیت اکنون چیست تا ثبت شود. رخداد جدا نیست؛
      همان مادهٔ گزارش است. اگر کار تمام شده و حاصلش گفته شود نتیجه است.
      اگر مانع نیازمند رسیدگی باشد مسئله است. ابلاغ رویه به جمع اطلاعیه است.
    required_slots:
      - name: گزارش‌دهنده
        description: کسی که وضعیت یا وقایع را روایت می‌کند.
      - name: وضعیت یا وقایع
        description: آنچه رخ داده یا وضعیت فعلی کار است.
    optional_slots:
      - name: بازه یا زمان وقوع
        description: کی یا در چه دوره‌ای این وضعیت بوده است.
      - name: مخاطب گزارش
        description: کسی که گزارش برای او نوشته شده.
      - name: شواهد یا شاخص
        description: عدد، سند یا مشاهدهٔ پشتیبان.
      - name: انحراف از برنامه
        description: فرق وضعیت با آنچه باید می‌بود.
    aliases:
      - گزارش
      - رخداد
      - event
    contrast:
      - خروجی تمام‌شده → result
      - اختلال نیازمند رسیدگی → issue
      - ابلاغ رویه به جمع → announcement
    accept_example: صبح در کارگاه جنوبی واحد مالی تسک پرداخت را نبسته است.
    reject_example: تسک پرداخت باید امشب بسته شود.

  - code: note
    name: یادداشت
    priority: 3
    definition: ثبت کوتاه برای ارجاع بعدی بدون انتظار واکنش فوری و بدون ابلاغ رسمی.
    description: >
      یادداشت برای خود یا تیم نزدیک است تا بعداً پیدا شود. انتظار جواب یا اقدام
      فوری ندارد. اگر کسی باید پاسخ بدهد سؤال یا درخواست است. ابلاغ به جمع
      اطلاعیه است.
    required_slots:
      - name: نویسنده
        description: کسی که نکته را ثبت می‌کند.
      - name: نکته ثبت‌شده
        description: همان مطلب کوتاه برای ارجاع بعدی.
    optional_slots:
      - name: زمینه ارجاع
        description: جلسه، سند یا پیامی که این نکته به آن وصل است.
      - name: مخاطب نزدیک
        description: خود نویسنده یا حلقهٔ خیلی محدود، نه ابلاغ سازمانی.
    aliases:
      - یادداشت
    contrast:
      - انتظار پاسخ یا اقدام → request یا question
      - ابلاغ رسمی به جمع → announcement
    accept_example: برای خودم؛ فردا شماره پیگیری قرارداد را از پرونده بردارم.
    reject_example: لطفاً شماره پیگیری قرارداد را بفرستید.

  - code: answer
    name: پاسخ
    priority: 2
    definition: پر کردن یک مجهول قبلی؛ بدون پرسش مرجع، گزارش است نه پاسخ.
    description: >
      پاسخ فقط وقتی است که به یک سؤال قبلی جواب می‌دهد. بدون پرسش مرجع در متن
      یا بافت، روایت وضعیت گزارش است. اگر جواب در اصل روش حل مسئله باشد و
      مسئله غالب شود، راهکار اصلی است و پاسخ فرعی می‌ماند.
    required_slots:
      - name: پاسخ‌دهنده
        description: کسی که جواب را می‌دهد.
      - name: محتوای جواب
        description: اطلاعاتی که مجهول را پر می‌کند.
      - name: پرسش مرجع
        description: سؤال صریح یا از بافت؛ بدون آن پاسخ نیست.
    optional_slots:
      - name: مخاطب پرسشگر
        description: کسی که قبلاً پرسیده بود.
      - name: قطعیت جواب
        description: قطعی، حدسی یا ناقص بودن جواب.
    aliases:
      - پاسخ
    contrast:
      - شروع موضوع جدید بدون پرسش → report
      - جواب همان‌طور راهکار است → solution اگر مسئله مرجع غالب باشد
    accept_example: در پاسخ به علت تأخیر؛ منتظر تأیید کارفرما بودیم.
    reject_example: کارفرما هنوز تأیید نکرده است.

  - code: message
    name: پیام
    priority: 1
    fallback: true
    definition: فقط وقتی هیچ قالب اجباری دیگری پر نشود. برچسب پیش‌فرض مدل نیست.
    description: >
      پیام سطل باقی‌مانده است برای احوال‌پرسی یا متنی که هیچ کنش مشخصی ندارد.
      اگر نقش اجباری ژانر دیگری پر شود حق انتخاب این برچسب نیست.
    required_slots:
      - name: فرستنده
        description: کسی که متن را فرستاده است.
      - name: محتوا
        description: بدنۀ پیام وقتی قالب دیگری صدق نمی‌کند.
    optional_slots:
      - name: گیرنده
        description: مخاطب پیام، اگر معلوم باشد.
    aliases:
      - پیام
    contrast:
      - اگر نقش اجباری ژانر دیگری پر است آن را بزن نه message
    accept_example: سلام، رسیدم.
    reject_example: سرور قطع است؛ لطفاً امشب بالا بیاورید.
