# صنعت بیان / لحن غیرصریح. کدها همان rhetoric_types فعال در seed هستند.
# شکل پیام در discourse.yaml است. غرض رسیدگی در intents.yaml است.
# اینجا فقط چگونگی گفتن است؛ اعتراض کنایه‌ای همچنان اعتراض می‌ماند.

rhetorics:
  - code: sarcasm
    name: طعنه
    priority: 9
    definition: کنایهٔ نیش‌دار خطاب به فرد، واحد یا نقش مشخص.
    description: >
      طعنه وقتی است که ظاهر تعریف یا تعارف است ولی نیش به مخاطب مشخص
      می‌زند. «دست واحد مالی درد نکنه»، «شاهکار پیمانکار» نشانه‌اش است.
      بدون هدف مشخص همان کنایه است. تعریف واقعی از کار خوب طعنه نیست.
    required_slots:
      - name: ظاهر
        description: واژه یا جمله‌ای که روی کاغذ مثبت یا تعارف است.
      - name: مقصود
        description: معنای منفی یا اعتراضی که گوینده می‌خواهد برساند.
      - name: هدف طعنه
        description: فرد، واحد یا نقشی که نیش متوجه او است.
    optional_slots:
      - name: شاهد نارسایی
        description: تأخیر، قطعی یا قصوری که طعنه روی آن سوار است.
    aliases:
      - طعنه
    contrast:
      - بدون مخاطب مشخص برای نیش → irony
      - تعریف واقعی از کار خوب → literal
    accept_example: دست واحد مالی درد نکنه، فقط سه هفته تأخیر.
    reject_example: دستتان درد نکند، گزارش را سر وقت فرستادید.

  - code: irony
    name: کنایه
    priority: 8
    definition: معنا خلاف ظاهر است؛ لازم نیست نیش به فرد مشخص بخورد.
    description: >
      کنایه وقتی است که ظاهر جمله با غرض یکی نیست. «چه عالی، باز هم
      سرور قطع شد» اعتراض است نه تعریف. اگر نیش به فرد یا واحد مشخص
      بخورد طعنه است. اگر فقط شوخی بی‌غرض باشد طنز است.
    required_slots:
      - name: ظاهر
        description: همان روی مثبت یا خنثی جمله.
      - name: مقصود
        description: غرض واقعی گوینده پس از وارونه‌خوانی ظاهر.
    optional_slots:
      - name: مورد
        description: وضعیتی که کنایه درباره‌اش است.
    aliases:
      - کنایه
    contrast:
      - نیش خطاب به فرد یا واحد مشخص → sarcasm
      - ظاهر و مقصود یکی است → literal
      - فقط شوخی بدون وارونگی معنا → humor
    accept_example: چه عالی، باز هم سرور قطع شد.
    reject_example: چه عالی که سرور بالا آمد.

  - code: rhetorical_question
    name: سؤال بلاغی
    priority: 7
    definition: ظاهر پرسش است ولی انتظار جواب ندارد؛ غرض اعتراض یا فشار است.
    description: >
      سؤال بلاغی «تا کی»، «مگر قرار نبود» است وقتی گوینده جواب نمی‌خواهد.
      اگر مجهول واقعی باشد و جواب بخواهد ژانر سؤال است نه این صنعت.
      این برچسب صنعت بیان است؛ نیت معمولاً اعتراض یا پیگیری است.
    required_slots:
      - name: ظاهر سؤال
        description: همان جملهٔ پرسشی در متن.
      - name: مقصود
        description: اعتراض، فشار یا پیگیری‌ای که پشت سؤال است.
    optional_slots:
      - name: مورد باز
        description: کار یا وضعیتی که سؤال بلاغی به آن اشاره دارد.
    aliases:
      - سؤال بلاغی
      - سوال بلاغی
    contrast:
      - مجهول واقعی و انتظار جواب → literal و ژانر question
    accept_example: تا کی باید دنبال صورت‌وضعیت بدویم؟
    reject_example: علت تأخیر پرداخت چیست؟

  - code: humor
    name: طنز
    priority: 6
    definition: شوخی برای پوشاندن نقد یا سبک کردن نارضایتی.
    description: >
      طنز لحن شوخی دارد ولی ممکن است مسئله یا اعتراض را برساند.
      «پروژه که موزه‌ست، هیچی تکون نمی‌خوره» طنز با استعاره است؛
      اگر صنعت غالب وارونگی معنا باشد کنایه را بزن. شوخی بی‌غرض کاری
      همان صریح نزدیک به پیام است.
    required_slots:
      - name: ظاهر شوخی
        description: همان بخش طنزآمیز متن.
      - name: مقصود
        description: نقد یا وضعیتی که شوخی آن را می‌رساند.
    optional_slots:
      - name: مورد
        description: موضوع شوخی اگر جدا از ظاهر باشد.
    aliases:
      - طنز
    contrast:
      - معنا خلاف ظاهر است نه فقط شوخی → irony
      - احوال‌پرسی بی‌غرض → literal
    accept_example: پروژه که موزه‌ست، هیچی تکون نمی‌خوره.
    reject_example: سلام، خسته نباشید.

  - code: metaphor
    name: استعاره
    priority: 5
    definition: چیزی به‌جای چیز دیگر بدون ادات تشبیه، برای رساندن وضع.
    description: >
      استعاره وقتی است که موضوع کاری با تصویر دیگری گفته شود.
      «این قرارداد شده چاه» یعنی کار قفل و پرهزینه است. اگر «مثل»
      یا «مانند» بیاید تشبیه است. خودِ استعاره نیت نیست.
    required_slots:
      - name: مشبه‌به
        description: تصویری که به‌جای موضوع آمده است.
      - name: مقصود
        description: معنای کاری که استعاره می‌رساند.
    optional_slots:
      - name: موضوع
        description: قرارداد، پروژه یا سیستمی که استعاره درباره‌اش است.
    aliases:
      - استعاره
    contrast:
      - با مانند یا مثل → simile
    accept_example: این قرارداد شده چاه.
    reject_example: این قرارداد مثل چاه شده است.

  - code: simile
    name: تشبیه
    priority: 4
    definition: مانند یا مثل برای رساندن وضع کاری.
    description: >
      تشبیه ادات دارد: «مثل»، «مانند»، «انگار». بدون ادات استعاره است.
      تشبیه هم صنعت بیان است نه مسیر رسیدگی.
    required_slots:
      - name: مشبه
        description: همان موضوع کاری که تشبیه شده.
      - name: مشبه‌به
        description: تصویری که با مانند یا مثل آمده.
    optional_slots:
      - name: مقصود
        description: دلالت کاری تشبیه اگر جدا گفته شده باشد.
    aliases:
      - تشبیه
    contrast:
      - بدون ادات تشبیه → metaphor
    accept_example: این قرارداد مثل چاه شده است.
    reject_example: این قرارداد شده چاه.

  - code: hyperbole
    name: اغراق
    priority: 3
    definition: بزرگ‌نمایی عدد یا شدت برای فشار، نه گزارش دقیق.
    description: >
      اغراق «صد بار گفتم»، «هیچ‌کس هیچ‌وقت» است وقتی مبالغه غالب است.
      عدد واقعی گزارش‌شده اغراق نیست. کم‌گویی جهت برعکس دارد.
    required_slots:
      - name: ظاهر اغراق
        description: همان بزرگ‌نمایی در متن.
      - name: مقصود
        description: فشار یا نارضایتی واقعی پشت مبالغه.
    optional_slots:
      - name: مورد
        description: کاری که درباره‌اش اغراق شده.
    aliases:
      - اغراق
    contrast:
      - کوچک‌نمایی برای اعتراض → understatement
      - عدد واقعی گزارش → literal
    accept_example: صد بار گفتم سرور را چک کنید.
    reject_example: سه بار سرور را چک کردم.

  - code: understatement
    name: کم‌گویی
    priority: 2
    definition: کوچک‌نمایی مسئله برای اعتراض یا طعنهٔ آرام.
    description: >
      کم‌گویی وقتی است که گوینده مسئله را کوچک‌تر از واقع می‌گوید تا
      اعتراض برسد. «فقط سه هفته تأخیر» اگر تأخیر جدی باشد کم‌گویی است.
      بزرگ‌نمایی اغراق است.
    required_slots:
      - name: ظاهر کم‌گویی
        description: عبارتی که مسئله را کوچک نشان می‌دهد.
      - name: مقصود
        description: جدی‌بودن واقعی از نظر گوینده.
    optional_slots:
      - name: مورد
        description: همان مسئلهٔ کوچک‌نمایی‌شده.
    aliases:
      - کم‌گویی
    contrast:
      - بزرگ‌نمایی → hyperbole
      - گزارش خنثی بدون کوچک‌نمایی → literal
    accept_example: فقط سه هفته تأخیر؛ چیز خاصی نیست.
    reject_example: پرداخت سه روز تأخیر دارد.

  - code: literal
    name: صریح
    priority: 1
    fallback: true
    definition: فقط وقتی هیچ صنعت دیگری پر نشود. ظاهر همان مقصود است.
    description: >
      صریح سطل باقی‌مانده است برای متنی که کنایه، طعنه، طنز یا استعاره
      ندارد. اگر نقش اجباری صنعت دیگری پر شود حق انتخاب این برچسب نیست.
    required_slots:
      - name: محتوا
        description: بدنۀ متن وقتی صنعت دیگری صدق نمی‌کند.
    optional_slots:
      - name: مقصود
        description: اگر بازنویسی لازم نباشد همان محتوا است.
    aliases:
      - صریح
    contrast:
      - اگر نقش اجباری صنعت دیگری پر است آن را بزن نه literal
    accept_example: سرور پشتیبان از دیشب قطع است.
    reject_example: چه عالی، باز هم سرور قطع شد.
