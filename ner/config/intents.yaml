# نیت گوینده. کدها همان intents فعال در seed هستند.
# شکل متن در discourse.yaml است. اینجا فقط غرض مسیر رسیدگی است.
# سؤال، پاسخ، پیشنهاد و هشدار تکرار ژانر بودند و از این لایه حذف شدند.

intents:
  - code: complaint
    name: شکایت
    priority: 10
    definition: ثبت قصور دیگری و گرفتن رسیدگی یا جبران.
    description: >
      شکایت وقتی است که گوینده حق ضایع‌شده می‌بیند، مقصر را نام می‌برد و
      رسیدگی یا جبران می‌خواهد. بدون مشتکی‌عنه یا خواسته فقط گزارش مشکل است.
      مخالفت با یک حکم بدون مطالبهٔ جبران اعتراض است.
      طعنه و کنایه اگر مقصر و خواسته داشته باشند همچنان شکایت‌اند.
    required_slots:
      - name: شاکی
        description: کسی که مدعی ضایع شدن حق یا ورود زیان است.
      - name: مشتکی‌عنه
        description: فرد، واحد، پیمانکار یا کارفرمایی که قصور به او نسبت داده شده.
      - name: مورد اختلاف
        description: عمل یا ترک عملی که محل شکایت است.
      - name: خواسته
        description: جبران، برخورد، اصلاح یا ثبت در صورت‌جلسه؛ بدون خواسته شکایت نیست.
    optional_slots:
      - name: زیان یا حق ضایع‌شده
        description: آنچه از دست رفته یا پایمال شده است.
      - name: زمان یا مکان وقوع
        description: کی و کجا آن عمل رخ داده است.
      - name: شاهد یا مدرک
        description: قرینه، سند یا ناظر پشتیبان ادعا.
      - name: مرجع رسیدگی
        description: جایی که شاکی انتظار دارد به موضوع رسیدگی شود.
    aliases:
      - شکایت
    contrast:
      - بدون مشتکی‌عنه یا خواسته → report_problem
      - فقط مخالفت با حکم بدون مطالبه جبران → objection
    accept_example: پیمانکار بی‌هماهنگی برق را قطع کرد؛ خسارت را در صورت‌جلسه می‌خواهم.
    reject_example: سرور قطع است.

  - code: objection
    name: اعتراض
    priority: 9
    definition: مخالفت با یک تصمیم، اقدام یا برداشت بدون لزوماً مطالبه جبران.
    description: >
      اعتراض موضع مخالف با یک حکم یا نظر است. لازم نیست خسارت بخواهد.
      اگر مقصر و جبران بیاید شکایت است. اگر یک پیشنهاد مشخص روی میز رد شود رد است.
      کنایه و طعنه و طنز اعتراض را باطل نمی‌کنند؛ «چه عالی، باز هم قطع شد»
      اعتراض است نه اطلاع‌رسانی. لازم نیست گوینده صریحاً بگوید مخالفم.
    required_slots:
      - name: معترض
        description: کسی که مخالفت می‌کند.
      - name: مورد اعتراض
        description: تصمیم، اقدام یا برداشتی که رد می‌شود.
    optional_slots:
      - name: موضع جایگزین
        description: آنچه معترض به‌جای آن حکم می‌خواهد.
      - name: دلیل مخالفت
        description: چرا آن حکم یا برداشت را قبول ندارد.
    aliases:
      - اعتراض
    contrast:
      - مقصر و خواسته جبران دارد → complaint
      - نپذیرفتن پیشنهاد روی میز → reject
      - تعریف واقعی نه وارونه → inform
    accept_example: با فریز اسکوپ مخالفم؛ باید پشتیبانی هم بماند.
    reject_example: پیمانکار باید خسارت بدهد.

  - code: reject
    name: رد
    priority: 8
    definition: نپذیرفتن پیشنهاد، تصمیم، گزارش یا تحویل مطرح‌شده.
    description: >
      رد یعنی یک مورد مشخص روی میز پذیرفته نشده است؛ تحویل، پیشنهاد، گزارش.
      مخالفت کلی با سیاست بدون مورد روی میز اعتراض است نه رد.
    required_slots:
      - name: ردکننده
        description: کسی که مورد روی میز را نمی‌پذیرد.
      - name: موضوع رد
        description: همان پیشنهاد، تحویل یا گزارشی که رد شده است.
    optional_slots:
      - name: دلیل رد
        description: چرا پذیرفته نشده است.
    aliases:
      - رد
    contrast:
      - مخالفت با سیاست کلی نه یک پیشنهاد روی میز → objection
    accept_example: این تحویل را نمی‌پذیرم؛ تست پرداخت قرمز است.
    reject_example: سیاست فریز اسکوپ اشتباه است.

  - code: approve
    name: تأیید
    priority: 7
    definition: پذیرفتن پیشنهاد، تصمیم، گزارش یا تحویل مطرح‌شده.
    description: >
      تأیید پذیرش موردی است که قبلاً مطرح شده. خودِ اعلام یک تصمیم تازه
      ژانر تصمیم است و نیت معمولاً اطلاع‌رسانی، نه تأیید.
    required_slots:
      - name: تأییدکننده
        description: کسی که مورد روی میز را می‌پذیرد.
      - name: موضوع تأیید
        description: پیشنهاد، تصمیم، گزارش یا تحویلی که قبول شده است.
    optional_slots:
      - name: شرط تأیید
        description: قیدی که پذیرش به آن مشروط شده است.
    aliases:
      - تأیید
      - تایید
    contrast:
      - خودش تصمیم جدید می‌گیرد نه پذیرش مورد روی میز → ژانر decision است و نیت اطلاع‌رسانی
    accept_example: پیشنهاد داشبورد را تأیید می‌کنم.
    reject_example: قرار شد فقط داشبورد باشد.

  - code: request_decision
    name: درخواست تصمیم
    priority: 6
    definition: مخاطب باید بین گزینه‌ها انتخاب کند؛ لزوماً خودش اجرا نمی‌کند.
    description: >
      غرض این است که کسی تصمیم بگیرد نه اینکه خودش کار را انجام دهد.
      «بگویید سوئیچ کنیم یا نه» درخواست تصمیم است. «سوئیچ را انجام دهید»
      درخواست اقدام است.
    required_slots:
      - name: درخواست‌کننده
        description: کسی که منتظر انتخاب است.
      - name: تصمیم‌گیر
        description: کسی که باید بین گزینه‌ها انتخاب کند.
      - name: موضوع تصمیم
        description: همان امری که باید درباره‌اش تصمیم گرفته شود.
    optional_slots:
      - name: گزینه‌ها
        description: انتخاب‌های مطرح‌شده، اگر در متن آمده باشد.
      - name: مهلت تصمیم
        description: تا کی باید انتخاب شود.
    aliases:
      - درخواست تصمیم
    contrast:
      - مطلوب اجرای کار است نه انتخاب → request_action
    accept_example: تا ساعت ۶ بگویید سوئیچ کنیم یا نه.
    reject_example: لطفاً امشب سوئیچ را انجام دهید.

  - code: request_action
    name: درخواست اقدام
    priority: 5
    definition: مخاطب باید کاری انجام دهد.
    description: >
      غرض اجرای یک کار است. اگر مطلوب انتخاب بین گزینه‌ها باشد درخواست تصمیم است.
      اگر مطلوب دانستن باشد درخواست اطلاعات است. اگر کار قبلی معطل مانده پیگیری است.
    required_slots:
      - name: درخواست‌کننده
        description: کسی که انجام کار را می‌خواهد.
      - name: عمل مطلوب
        description: کاری که باید انجام شود.
    optional_slots:
      - name: مسئول
        description: کسی که باید آن کار را انجام دهد.
      - name: مهلت
        description: زمان انجام کار.
    aliases:
      - درخواست اقدام
    contrast:
      - مطلوب انتخاب است نه اجرا → request_decision
      - مطلوب دانستن است → request_info
      - کار قبلی معطل است → follow_up
    accept_example: امشب سرور را بالا بیاورید.
    reject_example: بگویید سرور بالا آمد یا نه.

  - code: follow_up
    name: پیگیری
    priority: 4
    definition: جلو بردن کار، درخواست یا وظیفه قبلی که معطل مانده.
    description: >
      پیگیری به مورد باز قبلی وصل است. «همان قطعی دوشنبه» نشانه است.
      بدون ارجاع به قبل، درخواست اقدام تازه است.
      سؤال بلاغی دربارهٔ کار معطل («تا کی باید صبر کنیم؟») پیگیری است
      نه درخواست اطلاعات.
    required_slots:
      - name: پیگیری‌کننده
        description: کسی که مورد معطل را جلو می‌برد.
      - name: مورد باز
        description: کار، درخواست یا وظیفه‌ای که قبلاً مطرح شده و تمام نشده.
    optional_slots:
      - name: وعده یا مهلت قبلی
        description: زمانی که قرار بود آن مورد بسته شود.
    aliases:
      - پیگیری
    contrast:
      - بدون ارجاع به مورد قبلی → request_action
    accept_example: همان قطعی دوشنبه هنوز درست نشده.
    reject_example: سرور قطع شده؛ درستش کنید.

  - code: request_info
    name: درخواست اطلاعات
    priority: 3
    definition: مخاطب باید چیزی بگوید یا بفرستد. وقتی ژانر سؤال است معمولاً همین است.
    description: >
      غرض دانستن یا گرفتن سند و گزارش است نه انجام تعمیر یا اجرا.
      اگر باید کاری روی سیستم انجام شود درخواست اقدام است.
      سؤال بلاغی بدون انتظار جواب درخواست اطلاعات نیست.
    required_slots:
      - name: درخواست‌کننده
        description: کسی که اطلاعات می‌خواهد.
      - name: اطلاعات مطلوب
        description: مطلب، عدد، وضعیت یا سندی که باید گفته یا فرستاده شود.
    optional_slots:
      - name: مخاطب
        description: کسی که باید پاسخ یا سند را بدهد.
      - name: مهلت
        description: تا کی اطلاعات لازم است.
    aliases:
      - درخواست اطلاعات
    contrast:
      - مطلوب عمل است → request_action
      - ظاهر سؤال، غرض اعتراض یا پیگیری است → objection یا follow_up
    accept_example: بگویید پرداخت به کجا رسیده.
    reject_example: پرداخت را امروز ببندید.

  - code: report_problem
    name: گزارش مشکل
    priority: 2
    definition: مسئله دیده شود بدون مقصرسازی و بدون طلب جبران.
    description: >
      غرض این است که اختلال دیده شود تا رسیدگی فنی یا مدیریتی شروع شود.
      نسبت‌دادن قصور و طلب خسارت شکایت است. اگر هیچ اختلالی نباشد اطلاع‌رسانی است.
    required_slots:
      - name: گزارش‌دهنده
        description: کسی که مسئله را اطلاع می‌دهد.
      - name: مسئله
        description: همان اختلال یا مانع، بدون الزام به نام مقصر.
    optional_slots:
      - name: اثر
        description: این مشکل چه آسیبی زده است.
    aliases:
      - گزارش مشکل
    contrast:
      - شاکی و مشتکی‌عنه و خواسته دارد → complaint
      - هیچ اختلالی نیست → inform
    accept_example: سرور پشتیبان از دیشب قطع است.
    reject_example: پیمانکار عمداً قطع کرد؛ خسارت می‌خواهم.

  - code: inform
    name: اطلاع‌رسانی
    priority: 1
    fallback: true
    definition: مخاطب فقط بداند. خواسته عمل، تصمیم، جبران یا پیگیری ندارد.
    description: >
      اطلاع‌رسانی وقتی است که غرض فقط آگاهی است. اگر عمل، تصمیم، جبران یا
      پیگیری در متن باشد آن نیت را بزن نه این برچسب را.
      تعریف وارونه و طعنه اطلاع‌رسانی نیستند.
    required_slots:
      - name: آگاه‌کننده
        description: کسی که مطلب را می‌گوید تا دانسته شود.
      - name: مطلب
        description: خبر یا وضعیتی که باید دانسته شود.
    optional_slots:
      - name: مخاطب
        description: کسی که باید بداند.
    aliases:
      - اطلاع‌رسانی
    contrast:
      - اگر غرض دیگری پر است آن را بزن نه inform
      - ظاهر مثبت با خرابی یا تأخیر → objection یا report_problem
    accept_example: جلسه ساعت ۱۰ در کارگاه جنوبی است.
    reject_example: لطفاً ساعت جلسه را تأیید کنید.
