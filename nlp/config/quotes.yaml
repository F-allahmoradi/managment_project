# نقل‌قول و انتساب ادعا. فرستندهٔ پیام با گویندهٔ جملهٔ داخلی یکی نیست.

modes:
  - code: direct
    name: مستقیم
    definition: نقل قول با علامت یا بازنویسی نزدیک «گفت که …».
    required_slots:
      - name: گوینده نقل‌شده
        description: فرد یا واحدی که حرف به او نسبت داده شده.
      - name: محتوای نقل
        description: همان مطلبی که به او نسبت داده شده؛ باید در متن باشد.
  - code: indirect
    name: غیرمستقیم
    definition: گزارش سخن دیگری بدون لزوماً گیومه؛ «رفتم واحد مالی گفت».
    required_slots:
      - name: گوینده نقل‌شده
        description: منبع ادعا.
      - name: محتوای نقل
        description: خلاصه یا تکهٔ حرف نسبت‌داده‌شده از خود متن.

rules:
  - attributed_to باید زیررشتهٔ متن باشد.
  - quoted_text باید زیررشتهٔ متن باشد؛ بازنویسی آزاد حذف می‌شود.
  - اگر گوینده همان فرستنده باشد و نقل دیگری نباشد این لایه خالی می‌ماند.
