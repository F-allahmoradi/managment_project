services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: management_postgres
    # pgvector برای نوع vector و ایندکس HNSW؛ داده روی volume می‌ماند.
    restart: unless-stopped
    environment:
      POSTGRES_USER: management
      POSTGRES_PASSWORD: management
      POSTGRES_DB: management_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./deploy/postgres/initdb.sh:/docker-entrypoint-initdb.d/000_apply_sql.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U management -d management_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
